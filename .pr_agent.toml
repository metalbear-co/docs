# Qodo code review (qodo-code-review GitHub app) configuration, read from the
# default branch. Reviews are metered, so automatic review is skipped for PRs
# that are not worth reviewing. Any skipped PR can still be reviewed on demand
# by commenting `/agentic_review` on it.
# https://docs.qodo.ai/code-review/ignore-content-from-analysis

[config]
# Exact, case-sensitive label name. With automatic draft reviews disabled
# (Qodo's default), create a draft with `gh pr create --draft --label no-qodo`,
# then run `gh pr ready` after creation succeeds and the label is attached.
# `gh pr create --label no-qodo` alone is not safe: gh creates the PR before
# adding labels, so an automatic review can start before the label is applied.
ignore_pr_labels = ["no-qodo"]

[github_app]
# Skip PRs opened by GitHub bot accounts (release and dependency bots). This is
# Qodo's default, stated explicitly so the intent is visible.
ignore_bot_pr = true

[review_agent]
# Extra instructions for the Issue finding agent. A value here replaces the
# instructions set for that agent in the Qodo portal (Configurations > Prompts)
# for this repository.
# https://docs.qodo.ai/code-review/extra-instructions
issues_user_guidelines = """
A docs change can leave pages it does not touch wrong ("Changes That Reach
Several Pages" in AGENTS.md). When a pull request changes what a config field,
CLI flag, or Helm value does, report each other page under docs/ that still
describes the old behavior. When it adds a database engine or queue service,
report each list of its siblings it is missing from.
"""
