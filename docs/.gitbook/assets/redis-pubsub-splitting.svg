<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1222 288" width="1222" height="288" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Redis Pub/Sub splitting flow</title>
  <desc id="d">A producer publishes to the original channel, orders. The mirrord operator subscribes to the original channel, evaluates the session filters, and re-publishes each message to a temporary channel. Non-matching messages go to the main temporary channel, mirrord-main-orders-..., which the deployed consumer reads because the operator patched its channel environment variable. Matching messages go to the session channel, mirrord-user1-orders-..., which the local developer reads with mirrord exec.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
    <symbol id="k8s" viewBox="0 0 32 32">
      <polygon points="16.00,1.60 27.73,7.25 30.62,19.94 22.51,30.11 9.49,30.11 1.38,19.94 4.27,7.25" fill="#326CE5" stroke="#326CE5" stroke-width="2" stroke-linejoin="round"/>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <circle cx="16" cy="16" r="7"/>
        <line x1="16.00" y1="13.40" x2="16.00" y2="5.80"/><line x1="18.03" y1="14.38" x2="23.97" y2="9.64"/><line x1="18.53" y1="16.58" x2="25.94" y2="18.27"/><line x1="17.13" y1="18.34" x2="20.43" y2="25.19"/><line x1="14.87" y1="18.34" x2="11.57" y2="25.19"/><line x1="13.47" y1="16.58" x2="6.06" y2="18.27"/><line x1="13.97" y1="14.38" x2="8.03" y2="9.64"/>
      </g>
      <circle cx="16" cy="16" r="2.4" fill="#ffffff"/>
    </symbol>
  </defs>
  <rect x="0" y="0" width="1222" height="288" fill="#ffffff"/>

  <!-- Producer publishes to the original channel -->
  <rect x="20" y="112" width="110" height="64" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="75" y="149" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Producer</text>
  <line x1="130" y1="144" x2="198" y2="144" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="166" y="132" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">PUBLISH</text>
  <rect x="202" y="112" width="140" height="64" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="272" y="140" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">orders</text>
  <text x="272" y="160" font-size="12.5" fill="#333344" text-anchor="middle">original channel</text>

  <!-- The operator subscribes, filters, and re-publishes -->
  <line x1="342" y1="144" x2="428" y2="144" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="387" y="132" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">SUBSCRIBE</text>
  <rect x="432" y="40" width="210" height="208" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="537" y="122" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord operator</text>
  <text x="537" y="142" font-size="12.5" fill="#ffffff" text-anchor="middle">subscribes to orders</text>
  <text x="537" y="160" font-size="12.5" fill="#ffffff" text-anchor="middle">evaluates session filters</text>
  <text x="537" y="178" font-size="12.5" fill="#ffffff" text-anchor="middle">re-publishes to temp channels</text>

  <!-- Non-matching messages: main temporary channel, read by the deployed consumer -->
  <line x1="642" y1="80" x2="738" y2="80" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="690" y="68" font-size="12.5" fill="#333344" text-anchor="middle">non-matching</text>
  <rect x="742" y="40" width="210" height="80" rx="12" fill="#ffffff" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="847" y="76" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Main temp channel</text>
  <text x="847" y="96" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">mirrord-main-orders-...</text>
  <line x1="952" y1="80" x2="988" y2="80" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="992" y="40" width="208" height="80" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="1086" y="67" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Deployed consumer</text>
  <text x="1086" y="87" font-size="12.5" fill="#333344" text-anchor="middle">reads main channel</text>
  <text x="1086" y="105" font-size="12.5" fill="#333344" text-anchor="middle">(patched env var)</text>

  <!-- Matching messages: session channel, read by the local app -->
  <line x1="642" y1="208" x2="738" y2="208" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="690" y="196" font-size="12.5" fill="#4a44b8" text-anchor="middle">matching</text>
  <rect x="742" y="168" width="210" height="80" rx="12" fill="#ffffff" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="847" y="204" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Session channel</text>
  <text x="847" y="224" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">mirrord-user1-orders-...</text>
  <line x1="952" y1="208" x2="988" y2="208" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="992" y="168" width="208" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1096" y="204" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Local developer</text>
  <text x="1096" y="224" font-size="12.5" fill="#ffffff" text-anchor="middle">mirrord exec</text>
  <!-- Kubernetes logos: what runs in the cluster -->
  <use href="#k8s" x="624" y="230" width="36" height="36"/>
  <use href="#k8s" x="1182" y="102" width="36" height="36"/>
</svg>
