  <text x="340" y="28" font-size="12.5" font-weight="700" fill="#333344" text-anchor="middle">Operator</text>
  <text x="660" y="28" font-size="12.5" font-weight="700" fill="#333344" text-anchor="middle">Virtual queue</text>
  <text x="985" y="28" font-size="12.5" font-weight="700" fill="#333344" text-anchor="middle">Receiver</text>

  <!-- Worker 1: split-enabled flow, with mirrord -->
