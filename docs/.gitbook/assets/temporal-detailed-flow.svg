<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 990" width="1200" height="990" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Temporal queue splitting detailed system flow</title>
  <desc id="d">Each real Temporal task queue follows one route. Worker 1 runs with mirrord. For the split queue checkout, the operator polls the real queue and applies the filter workflow_id ^dev-. Tasks that match go to the session virtual queue mirrord-session-dev-...-checkout, which the dev local worker reads. All other tasks go to the main virtual queue mirrord-main-...-checkout, which the cluster worker reads. The split queue shipping works the same way with the filter activity_type ^ShipOrder$. The queues billing and notify are not split: the operator forwards them as-is, they stay real with no virtual queue, and the cluster worker reads them. Worker 2 runs without mirrord and polls the reports and audit queues directly, with no operator and no virtual queue. All receivers send their replies, unchanged, to Temporal on the real queue name. On your machine, the mirrord client starts your local worker and connects it through the operator proxy, with TEMPORAL_ADDRESS patched. The local worker polls mirrord-session-dev-...-checkout and mirrord-session-dev-...-shipping and receives only the tasks that match its filters.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
    <symbol id="k8s" viewBox="0 0 32 32">
      <polygon points="16.00,1.60 27.73,7.25 30.62,19.94 22.51,30.11 9.49,30.11 1.38,19.94 4.27,7.25" fill="#326CE5" stroke="#326CE5" stroke-width="2" stroke-linejoin="round"/>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <circle cx="16" cy="16" r="7"/>
        <line x1="16.00" y1="13.40" x2="16.00" y2="5.80"/><line x1="18.03" y1="14.38" x2="23.97" y2="9.64"/><line x1="18.53" y1="16.58" x2="25.94" y2="18.27"/><line x1="17.13" y1="18.34" x2="20.43" y2="25.19"/><line x1="14.87" y1="18.34" x2="11.57" y2="25.19"/><line x1="13.47" y1="16.58" x2="6.06" y2="18.27"/><line x1="13.97" y1="14.38" x2="8.03" y2="9.64"/>
      </g>
      <circle cx="16" cy="16" r="2.4" fill="#ffffff"/>
    </symbol>
  </defs>
  <rect x="0" y="0" width="1200" height="990" fill="#ffffff"/>

  <!-- Column headings -->
