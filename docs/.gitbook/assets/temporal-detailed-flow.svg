  <text x="105" y="643" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">audit</text>
  <text x="105" y="661" font-size="12.5" fill="#333344" text-anchor="middle">real queue</text>
  <line x1="170" y1="646" x2="876" y2="646" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="525" y="636" font-size="12.5" fill="#333344" text-anchor="middle">no operator, no virtual queue</text>
  <rect x="880" y="618" width="210" height="56" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="985" y="643" font-size="12.5" font-weight="700" fill="#232141" text-anchor="middle">Worker 2</text>
  <text x="985" y="661" font-size="12.5" fill="#333344" text-anchor="middle">polls <tspan font-family="Menlo, Consolas, monospace" fill="#232141">audit</tspan> directly</text>

  <!-- Replies to Temporal on the real queue name -->
  <line x1="1090" y1="106" x2="1170" y2="106" stroke="#232141" stroke-width="2.5"/>
  <line x1="1090" y1="162" x2="1170" y2="162" stroke="#232141" stroke-width="2.5"/>
  <line x1="1090" y1="226" x2="1170" y2="226" stroke="#232141" stroke-width="2.5"/>
  <line x1="1090" y1="282" x2="1170" y2="282" stroke="#232141" stroke-width="2.5"/>
  <line x1="1090" y1="352" x2="1170" y2="352" stroke="#232141" stroke-width="2.5"/>
  <line x1="1090" y1="428" x2="1170" y2="428" stroke="#232141" stroke-width="2.5"/>
  <line x1="1090" y1="570" x2="1170" y2="570" stroke="#232141" stroke-width="2.5"/>
  <line x1="1090" y1="646" x2="1170" y2="646" stroke="#232141" stroke-width="2.5"/>
  <polyline points="1170,106 1170,740 404,740" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1156" y="728" font-size="12.5" fill="#333344" text-anchor="end">replies, unchanged</text>
  <rect x="40" y="712" width="360" height="56" rx="12" fill="#FFCB7D" stroke="#232141" stroke-width="2"/>
  <text x="220" y="736" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Temporal</text>
  <text x="220" y="756" font-size="12.5" fill="#333344" text-anchor="middle">receives replies on the real queue name</text>

  <!-- Your machine -->
  <rect x="20" y="796" width="1160" height="176" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="36" y="822" font-size="15" font-weight="700" fill="#4a44b8">Your machine</text>
  <text x="36" y="842" font-size="12.5" fill="#333344">Local workers run with mirrord. They connect through the operator proxy, not to Temporal directly.</text>
  <rect x="40" y="858" width="420" height="94" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="250" y="888" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord client</text>
  <text x="250" y="912" font-size="12.5" fill="#ffffff" text-anchor="middle">starts your local worker and connects it</text>
  <text x="250" y="930" font-size="12.5" fill="#ffffff" text-anchor="middle">through the operator proxy (<tspan font-family="Menlo, Consolas, monospace">TEMPORAL_ADDRESS</tspan> patched)</text>
  <line x1="460" y1="905" x2="536" y2="905" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="540" y="858" width="520" height="94" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="800" y="882" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Dev local worker</text>
  <text x="800" y="904" font-size="12.5" fill="#ffffff" text-anchor="middle">polls <tspan font-family="Menlo, Consolas, monospace">mirrord-session-dev-...-checkout</tspan></text>
  <text x="800" y="922" font-size="12.5" fill="#ffffff" text-anchor="middle">and <tspan font-family="Menlo, Consolas, monospace">mirrord-session-dev-...-shipping</tspan></text>
  <text x="800" y="940" font-size="12.5" fill="#ffffff" text-anchor="middle">receives only the tasks that match its filters</text>
</svg>
