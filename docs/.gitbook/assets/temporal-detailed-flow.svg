  <text x="105" y="425" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">notify</text>
  <text x="105" y="443" font-size="12.5" fill="#333344" text-anchor="middle">real queue</text>
  <line x1="170" y1="428" x2="226" y2="428" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="230" y="400" width="220" height="56" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="340" y="425" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">no split</text>
  <text x="340" y="443" font-size="12.5" fill="#ffffff" text-anchor="middle">forwards as-is</text>
  <line x1="450" y1="428" x2="516" y2="428" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="520" y="406" width="280" height="44" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="660" y="433" font-size="12.5" fill="#333344" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace" fill="#232141">notify</tspan>, stays real, no virtual queue</text>
  <line x1="800" y1="428" x2="876" y2="428" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="880" y="406" width="210" height="44" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="985" y="433" font-size="12.5" font-weight="700" fill="#232141" text-anchor="middle">cluster worker</text>

  <!-- Worker 2: normal flow, no mirrord -->
  <rect x="20" y="500" width="1120" height="192" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <use href="#k8s" x="36" y="510" width="20" height="20"/>
  <text x="62" y="526" font-size="15" font-weight="700" fill="#4a44b8">Worker 2: normal flow, no mirrord</text>

  <!-- reports -->
  <rect x="40" y="542" width="130" height="56" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="105" y="567" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">reports</text>
  <text x="105" y="585" font-size="12.5" fill="#333344" text-anchor="middle">real queue</text>
  <line x1="170" y1="570" x2="876" y2="570" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="525" y="560" font-size="12.5" fill="#333344" text-anchor="middle">no operator, no virtual queue</text>
  <rect x="880" y="542" width="210" height="56" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="985" y="567" font-size="12.5" font-weight="700" fill="#232141" text-anchor="middle">Worker 2</text>
  <text x="985" y="585" font-size="12.5" fill="#333344" text-anchor="middle">polls <tspan font-family="Menlo, Consolas, monospace" fill="#232141">reports</tspan> directly</text>

  <!-- audit -->
