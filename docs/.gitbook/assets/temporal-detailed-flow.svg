  <text x="105" y="131" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">checkout</text>
  <text x="105" y="149" font-size="12.5" fill="#333344" text-anchor="middle">real queue</text>
  <line x1="170" y1="134" x2="226" y2="134" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="230" y="99" width="220" height="70" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="340" y="126" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">poll real queue</text>
  <text x="340" y="148" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#ffffff" text-anchor="middle">workflow_id ^dev-</text>
  <polyline points="450,134 488,134 488,106 516,106" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polyline points="450,134 488,134 488,162 516,162" fill="none" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="520" y="84" width="280" height="44" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="660" y="111" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">mirrord-main-...-checkout</text>
  <rect x="520" y="140" width="280" height="44" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="660" y="167" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">mirrord-session-dev-...-checkout</text>
  <line x1="800" y1="106" x2="876" y2="106" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="162" x2="876" y2="162" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="880" y="84" width="210" height="44" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="985" y="111" font-size="12.5" font-weight="700" fill="#232141" text-anchor="middle">cluster worker</text>
  <rect x="880" y="140" width="210" height="44" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="985" y="167" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">dev local worker</text>

  <!-- shipping: split -->
  <rect x="40" y="226" width="130" height="56" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="105" y="251" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">shipping</text>
  <text x="105" y="269" font-size="12.5" fill="#333344" text-anchor="middle">real queue</text>
  <line x1="170" y1="254" x2="226" y2="254" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="230" y="219" width="220" height="70" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="340" y="246" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">poll real queue</text>
  <text x="340" y="268" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#ffffff" text-anchor="middle">activity_type ^ShipOrder$</text>
  <polyline points="450,254 488,254 488,226 516,226" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polyline points="450,254 488,254 488,282 516,282" fill="none" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="520" y="204" width="280" height="44" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="660" y="231" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">mirrord-main-...-shipping</text>
  <rect x="520" y="260" width="280" height="44" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="660" y="287" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">mirrord-session-dev-...-shipping</text>
  <line x1="800" y1="226" x2="876" y2="226" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="282" x2="876" y2="282" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="880" y="204" width="210" height="44" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="985" y="231" font-size="12.5" font-weight="700" fill="#232141" text-anchor="middle">cluster worker</text>
  <rect x="880" y="260" width="210" height="44" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="985" y="287" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">dev local worker</text>

  <!-- billing: not split -->
  <rect x="40" y="324" width="130" height="56" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="105" y="349" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">billing</text>
  <text x="105" y="367" font-size="12.5" fill="#333344" text-anchor="middle">real queue</text>
  <line x1="170" y1="352" x2="226" y2="352" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="230" y="324" width="220" height="56" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="340" y="349" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">no split</text>
  <text x="340" y="367" font-size="12.5" fill="#ffffff" text-anchor="middle">forwards as-is</text>
  <line x1="450" y1="352" x2="516" y2="352" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="520" y="330" width="280" height="44" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="660" y="357" font-size="12.5" fill="#333344" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace" fill="#232141">billing</tspan>, stays real, no virtual queue</text>
  <line x1="800" y1="352" x2="876" y2="352" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="880" y="330" width="210" height="44" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="985" y="357" font-size="12.5" font-weight="700" fill="#232141" text-anchor="middle">cluster worker</text>

  <!-- notify: not split -->
