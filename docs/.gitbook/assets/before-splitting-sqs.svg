<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A K8s application that consumes messages from an SQS message queue</title>
  <desc id="d">A producer sends messages to an SQS message queue. The application deployed on Kubernetes consumes the messages directly from the queue.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <symbol id="k8s" viewBox="0 0 32 32">
      <polygon points="16.00,1.60 27.73,7.25 30.62,19.94 22.51,30.11 9.49,30.11 1.38,19.94 4.27,7.25" fill="#326CE5" stroke="#326CE5" stroke-width="2" stroke-linejoin="round"/>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <circle cx="16" cy="16" r="7"/>
        <line x1="16.00" y1="13.40" x2="16.00" y2="5.80"/><line x1="18.03" y1="14.38" x2="23.97" y2="9.64"/><line x1="18.53" y1="16.58" x2="25.94" y2="18.27"/><line x1="17.13" y1="18.34" x2="20.43" y2="25.19"/><line x1="14.87" y1="18.34" x2="11.57" y2="25.19"/><line x1="13.47" y1="16.58" x2="6.06" y2="18.27"/><line x1="13.97" y1="14.38" x2="8.03" y2="9.64"/>
      </g>
      <circle cx="16" cy="16" r="2.4" fill="#ffffff"/>
    </symbol>
  </defs>
  <rect x="0" y="0" width="1200" height="190" fill="#ffffff"/>

  <!-- Producer -->
  <rect x="20" y="70" width="180" height="64" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="110" y="108" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Producer</text>
  <line x1="200" y1="102" x2="366" y2="102" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="283" y="92" font-size="12.5" fill="#333344" text-anchor="middle">send messages</text>

  <!-- Message queue -->
  <rect x="370" y="70" width="300" height="64" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="500" y="108" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Message queue</text>
  <line x1="634" y1="82" x2="634" y2="122" stroke="#232141" stroke-width="1.5"/>
  <line x1="642" y1="82" x2="642" y2="122" stroke="#232141" stroke-width="1.5"/>
  <line x1="650" y1="82" x2="650" y2="122" stroke="#232141" stroke-width="1.5"/>

  <!-- Application deployed on Kubernetes -->
  <line x1="670" y1="102" x2="896" y2="102" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="790" y="92" font-size="12.5" fill="#333344" text-anchor="middle">consume messages</text>
  <rect x="900" y="62" width="280" height="80" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="1040" y="97" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Application</text>
  <text x="1040" y="119" font-size="12.5" fill="#333344" text-anchor="middle">deployed on K8s</text>

  <!-- Logos: what runs in the cluster, and the broker -->
  <use href="#k8s" x="1162" y="124" width="36" height="36"/>
</svg>
