<svg xmlns="http://www.w3.org/2000/svg" viewBox="440 0 760 290" width="760" height="290" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A K8s application that consumes messages from an SQS message queue</title>
  <desc id="d">A producer sends messages to an SQS message queue. The application deployed on Kubernetes consumes the messages directly from the queue.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
  </defs>
  <rect x="440" y="0" width="760" height="290" fill="#ffffff"/>


  <!-- Producer -->
  <rect x="520" y="20" width="180" height="56" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="610" y="54" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Producer</text>
  <line x1="610" y1="76" x2="610" y2="158" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="622" y="102" font-size="12.5" fill="#333344" text-anchor="start">send messages</text>

  <!-- Message queue -->
  <rect x="485" y="160" width="250" height="80" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <line x1="699" y1="180" x2="699" y2="220" stroke="#232141" stroke-width="1.5"/>
  <line x1="707" y1="180" x2="707" y2="220" stroke="#232141" stroke-width="1.5"/>
  <line x1="715" y1="180" x2="715" y2="220" stroke="#232141" stroke-width="1.5"/>
  <text x="592" y="206" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Message queue</text>

  <!-- Deployed application -->
  <line x1="735" y1="200" x2="918" y2="200" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="840" y="190" font-size="12.5" fill="#333344" text-anchor="middle">consume messages</text>
  <rect x="920" y="160" width="260" height="80" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="1050" y="197" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Application</text>
  <text x="1050" y="217" font-size="12.5" fill="#333344" text-anchor="middle">deployed on K8s</text>
</svg>
