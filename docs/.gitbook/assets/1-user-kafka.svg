<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1202 530" width="1202" height="530" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One Kafka splitting session</title>
  <desc id="d">A producer sends messages to a Kafka topic in the Kafka cluster. The mirrord operator consumes these messages. It sends messages that match filter x to a temporary topic for the local application, which runs locally with mirrord. It sends messages that do not match the filter to a temporary topic for the deployed application. Each application consumes messages from its own temporary topic.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
    <symbol id="k8s" viewBox="0 0 32 32">
      <polygon points="16.00,1.60 27.73,7.25 30.62,19.94 22.51,30.11 9.49,30.11 1.38,19.94 4.27,7.25" fill="#326CE5" stroke="#326CE5" stroke-width="2" stroke-linejoin="round"/>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <circle cx="16" cy="16" r="7"/>
        <line x1="16.00" y1="13.40" x2="16.00" y2="5.80"/><line x1="18.03" y1="14.38" x2="23.97" y2="9.64"/><line x1="18.53" y1="16.58" x2="25.94" y2="18.27"/><line x1="17.13" y1="18.34" x2="20.43" y2="25.19"/><line x1="14.87" y1="18.34" x2="11.57" y2="25.19"/><line x1="13.47" y1="16.58" x2="6.06" y2="18.27"/><line x1="13.97" y1="14.38" x2="8.03" y2="9.64"/>
      </g>
      <circle cx="16" cy="16" r="2.4" fill="#ffffff"/>
    </symbol>
    <symbol id="kafka" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="15" fill="#ffffff" stroke="#232141" stroke-width="1.5"/>
      <path transform="translate(5.5 5.5) scale(0.875)" fill="#231F20" d="M9.71 2.136a1.43 1.43 0 0 0-2.047 0h-.007a1.48 1.48 0 0 0-.421 1.042c0 .41.161.777.422 1.039l.007.007c.257.264.616.426 1.019.426.404 0 .766-.162 1.027-.426l.003-.007c.261-.262.421-.629.421-1.039 0-.408-.159-.777-.421-1.042H9.71zM8.683 22.295c.404 0 .766-.167 1.027-.429l.003-.008c.261-.261.421-.631.421-1.036 0-.41-.159-.778-.421-1.044H9.71a1.42 1.42 0 0 0-1.027-.432 1.4 1.4 0 0 0-1.02.432h-.007c-.26.266-.422.634-.422 1.044 0 .406.161.775.422 1.036l.007.008c.258.262.617.429 1.02.429zm7.89-4.462c.359-.096.683-.33.882-.684l.027-.052a1.47 1.47 0 0 0 .114-1.067 1.454 1.454 0 0 0-.675-.896l-.021-.014a1.425 1.425 0 0 0-1.078-.132c-.36.091-.684.335-.881.686-.2.349-.241.75-.146 1.119.099.363.33.691.675.896h.002c.346.203.737.239 1.101.144zm-6.405-7.342a2.083 2.083 0 0 0-1.485-.627c-.58 0-1.103.242-1.482.627-.378.385-.612.916-.612 1.507s.233 1.124.612 1.514a2.08 2.08 0 0 0 2.967 0c.379-.39.612-.923.612-1.514s-.233-1.122-.612-1.507zm-.835-2.51c.843.141 1.6.552 2.178 1.144h.004c.092.093.182.196.265.299l1.446-.851a3.176 3.176 0 0 1-.047-1.808 3.149 3.149 0 0 1 1.456-1.926l.025-.016a3.062 3.062 0 0 1 2.345-.306c.77.21 1.465.721 1.898 1.482v.002c.431.757.518 1.626.313 2.408a3.145 3.145 0 0 1-1.456 1.928l-.198.118h-.02a3.095 3.095 0 0 1-2.154.201 3.127 3.127 0 0 1-1.514-.944l-1.444.848a4.162 4.162 0 0 1 0 2.879l1.444.846c.413-.47.939-.789 1.514-.944a3.041 3.041 0 0 1 2.371.319l.048.023v.002a3.17 3.17 0 0 1 1.408 1.906 3.215 3.215 0 0 1-.313 2.405l-.026.053-.003-.005a3.147 3.147 0 0 1-1.867 1.436 3.096 3.096 0 0 1-2.371-.318v-.006a3.156 3.156 0 0 1-1.456-1.927 3.175 3.175 0 0 1 .047-1.805l-1.446-.848a3.905 3.905 0 0 1-.265.294l-.004.005a3.938 3.938 0 0 1-2.178 1.138v1.699a3.09 3.09 0 0 1 1.56.862l.002.004c.565.572.914 1.368.914 2.243 0 .873-.35 1.664-.914 2.239l-.002.009a3.1 3.1 0 0 1-2.21.931 3.1 3.1 0 0 1-2.206-.93h-.002v-.009a3.186 3.186 0 0 1-.916-2.239c0-.875.35-1.672.916-2.243v-.004h.002a3.1 3.1 0 0 1 1.558-.862v-1.699a3.926 3.926 0 0 1-2.176-1.138l-.006-.005a4.098 4.098 0 0 1-1.173-2.874c0-1.122.452-2.136 1.173-2.872h.006a3.947 3.947 0 0 1 2.176-1.144V6.289a3.137 3.137 0 0 1-1.558-.864h-.002v-.004a3.192 3.192 0 0 1-.916-2.243c0-.871.35-1.669.916-2.243l.002-.002A3.084 3.084 0 0 1 8.683 0c.861 0 1.641.355 2.21.932v.002h.002c.565.574.914 1.372.914 2.243 0 .876-.35 1.667-.914 2.243l-.002.005a3.142 3.142 0 0 1-1.56.864v1.692zm8.121-1.129l-.012-.019a1.452 1.452 0 0 0-.87-.668 1.43 1.43 0 0 0-1.103.146h.002c-.347.2-.58.529-.677.896-.095.365-.054.768.146 1.119l.007.009c.2.347.519.579.874.673.357.103.755.059 1.098-.144l.019-.009a1.47 1.47 0 0 0 .657-.885 1.493 1.493 0 0 0-.141-1.118"/>
    </symbol>
  </defs>
  <rect x="0" y="0" width="1202" height="530" fill="#ffffff"/>

  <!-- Kafka cluster -->
  <rect x="460" y="116" width="300" height="390" rx="16" fill="#F5F4FE" stroke="#756DF3" stroke-width="2"/>
  <text x="478" y="142" font-size="15" font-weight="700" fill="#4a44b8" text-anchor="start">Kafka cluster</text>

  <!-- Producer -->
  <rect x="520" y="20" width="180" height="56" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="610" y="54" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Producer</text>
  <line x1="610" y1="76" x2="610" y2="158" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="622" y="102" font-size="12.5" fill="#333344" text-anchor="start">send messages</text>

  <!-- Kafka topic -->
  <rect x="485" y="160" width="250" height="80" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <line x1="699" y1="180" x2="699" y2="220" stroke="#232141" stroke-width="1.5"/>
  <line x1="707" y1="180" x2="707" y2="220" stroke="#232141" stroke-width="1.5"/>
  <line x1="715" y1="180" x2="715" y2="220" stroke="#232141" stroke-width="1.5"/>
  <text x="592" y="206" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Kafka topic</text>

  <!-- mirrord operator consumes the original messages -->
  <polyline points="485,200 130,200 130,288" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="190" font-size="12.5" fill="#333344" text-anchor="middle">consume messages</text>
  <rect x="20" y="290" width="220" height="190" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="130" y="382" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord operator</text>
  <text x="130" y="402" font-size="12.5" fill="#ffffff" text-anchor="middle">routes by filter</text>

  <!-- Session x: temporary topic and local application -->
  <line x1="240" y1="330" x2="483" y2="330" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="352" y="304" font-size="12.5" fill="#4a44b8" text-anchor="middle">send messages</text>
  <text x="352" y="320" font-size="12.5" fill="#4a44b8" text-anchor="middle">matching filter x</text>
  <rect x="485" y="290" width="250" height="80" rx="12" fill="#ffffff" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="699" y1="310" x2="699" y2="350" stroke="#756DF3" stroke-width="1.5"/>
  <line x1="707" y1="310" x2="707" y2="350" stroke="#756DF3" stroke-width="1.5"/>
  <line x1="715" y1="310" x2="715" y2="350" stroke="#756DF3" stroke-width="1.5"/>
  <text x="592" y="327" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Temporary topic</text>
  <text x="592" y="347" font-size="12.5" fill="#333344" text-anchor="middle">for local application x</text>
  <line x1="735" y1="330" x2="918" y2="330" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="840" y="320" font-size="12.5" fill="#4a44b8" text-anchor="middle">consume messages</text>
  <rect x="920" y="290" width="260" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1050" y="318" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Application</text>
  <text x="1050" y="338" font-size="12.5" fill="#ffffff" text-anchor="middle">running locally with mirrord</text>
  <text x="1050" y="355" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#ffffff" text-anchor="middle">filter x</text>

  <!-- Temporary topic and deployed application -->
  <line x1="240" y1="440" x2="483" y2="440" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="352" y="414" font-size="12.5" fill="#333344" text-anchor="middle">send messages</text>
  <text x="352" y="430" font-size="12.5" fill="#333344" text-anchor="middle">not matching the filter</text>
  <rect x="485" y="400" width="250" height="80" rx="12" fill="#ffffff" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="699" y1="420" x2="699" y2="460" stroke="#756DF3" stroke-width="1.5"/>
  <line x1="707" y1="420" x2="707" y2="460" stroke="#756DF3" stroke-width="1.5"/>
  <line x1="715" y1="420" x2="715" y2="460" stroke="#756DF3" stroke-width="1.5"/>
  <text x="592" y="437" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Temporary topic</text>
  <text x="592" y="457" font-size="12.5" fill="#333344" text-anchor="middle">for deployed application</text>
  <line x1="735" y1="440" x2="918" y2="440" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="840" y="430" font-size="12.5" fill="#333344" text-anchor="middle">consume messages</text>
  <rect x="920" y="400" width="260" height="80" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="1050" y="437" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Application</text>
  <text x="1050" y="457" font-size="12.5" fill="#333344" text-anchor="middle">deployed on K8s</text>
  <!-- Kubernetes logos: what runs in the cluster -->
  <use href="#k8s" x="222" y="462" width="36" height="36"/>
  <use href="#k8s" x="1162" y="462" width="36" height="36"/>
  <use href="#kafka" x="742" y="98" width="36" height="36"/>
</svg>
