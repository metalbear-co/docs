<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 124" width="1060" height="124" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Pub/Sub without splitting</title>
  <desc id="d">Publishers publish messages to original-topic. The target app, the deployed consumer, reads the messages from original-subscription.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1060" height="124" fill="#ffffff"/>

  <!-- Publishers, original topic, and original subscription -->
  <rect x="30" y="30" width="150" height="64" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="105" y="58" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Publishers</text>
  <text x="105" y="78" font-size="12.5" fill="#333344" text-anchor="middle">publish messages</text>
  <line x1="180" y1="62" x2="226" y2="62" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="230" y="30" width="200" height="64" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="330" y="58" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">original-topic</text>
  <text x="330" y="78" font-size="12.5" fill="#333344" text-anchor="middle">topic</text>
  <line x1="430" y1="62" x2="466" y2="62" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="470" y="30" width="260" height="64" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="600" y="58" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">original-subscription</text>
  <text x="600" y="78" font-size="12.5" fill="#333344" text-anchor="middle">subscription</text>

  <!-- The target app reads the original subscription directly -->
  <line x1="730" y1="62" x2="796" y2="62" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="765" y="50" font-size="12.5" fill="#333344" text-anchor="middle">reads</text>
  <rect x="800" y="30" width="230" height="64" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="915" y="58" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Target app</text>
  <text x="915" y="78" font-size="12.5" fill="#333344" text-anchor="middle">deployed consumer</text>
</svg>
