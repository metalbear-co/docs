<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 1202 442" width="1202" height="442" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Preview environment modification workflow</title>
  <desc id="d">Step 4: on your machine, you run mirrord preview start --target users-service --image &lt;code-image&gt; --key &lt;env-key&gt; with the key of an existing preview environment. Step 5: in the staging cluster, mirrord starts a temporary users-service preview pod that runs your image and lives until the TTL expires. It joins the cars-service preview pod from step 3. The two preview pods act as one isolated environment, and requests to cars-service and users-service that match the env key filter go to them.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
    <symbol id="k8s" viewBox="0 0 32 32">
      <polygon points="16.00,1.60 27.73,7.25 30.62,19.94 22.51,30.11 9.49,30.11 1.38,19.94 4.27,7.25" fill="#326CE5" stroke="#326CE5" stroke-width="2" stroke-linejoin="round"/>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <circle cx="16" cy="16" r="7"/>
        <line x1="16.00" y1="13.40" x2="16.00" y2="5.80"/><line x1="18.03" y1="14.38" x2="23.97" y2="9.64"/><line x1="18.53" y1="16.58" x2="25.94" y2="18.27"/><line x1="17.13" y1="18.34" x2="20.43" y2="25.19"/><line x1="14.87" y1="18.34" x2="11.57" y2="25.19"/><line x1="13.47" y1="16.58" x2="6.06" y2="18.27"/><line x1="13.97" y1="14.38" x2="8.03" y2="9.64"/>
      </g>
      <circle cx="16" cy="16" r="2.4" fill="#ffffff"/>
    </symbol>
  </defs>
  <rect x="0" y="-2" width="1202" height="442" fill="#ffffff"/>

  <!-- Your machine -->
  <rect x="20" y="20" width="400" height="400" rx="16" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="48" font-size="15" font-weight="700" fill="#4a44b8">Your machine</text>

  <!-- CLI command -->
  <rect x="50" y="70" width="340" height="130" rx="10" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <circle cx="74" cy="94" r="11" fill="#756DF3"/>
  <text x="74" y="98.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="94" y="99" font-size="14" font-weight="700" fill="#232141">Add a service to the preview</text>
  <text x="70" y="126" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">mirrord preview start</text>
  <text x="70" y="144" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">  --target users-service</text>
  <text x="70" y="162" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">  --image &lt;code-image&gt;</text>
  <text x="70" y="180" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">  --key &lt;env-key&gt;</text>

  <!-- Same env key note -->
  <rect x="50" y="232" width="340" height="120" rx="10" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="70" y="261" font-size="14" font-weight="700" fill="#232141">Same env key, new target</text>
  <text x="70" y="290" font-size="12.5" fill="#333344">The key is the one from step 1, so the new</text>
  <text x="70" y="308" font-size="12.5" fill="#333344">pod joins the same preview environment.</text>
  <text x="70" y="336" font-size="12.5" fill="#333344">Traffic is filtered by the same env key.</text>

  <!-- Staging cluster -->
  <rect x="480" y="20" width="700" height="400" rx="16" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="500" y="48" font-size="15" font-weight="700" fill="#4a44b8">Staging cluster</text>

  <!-- Deployed services -->
  <rect x="540" y="70" width="220" height="80" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="650" y="106" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">cars-service</text>
  <text x="650" y="126" font-size="12.5" fill="#333344" text-anchor="middle">deployed</text>
  <rect x="920" y="70" width="220" height="80" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="1030" y="106" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">users-service</text>
  <text x="1030" y="126" font-size="12.5" fill="#333344" text-anchor="middle">deployed</text>
  <line x1="760" y1="98" x2="916" y2="98" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="920" y1="124" x2="764" y2="124" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Preview environment -->
  <rect x="510" y="212" width="650" height="190" rx="14" fill="#ffffff" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="530" y="240" font-size="15" font-weight="700" fill="#4a44b8">Preview environment</text>
  <text x="530" y="257" font-size="12.5" fill="#333344">one env key</text>

  <!-- Filtered traffic to cars-service preview -->
  <line x1="730" y1="150" x2="730" y2="268" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="740" y="178" font-size="12.5" fill="#4a44b8">filtered by</text>
  <text x="740" y="194" font-size="12.5" fill="#4a44b8">env key</text>

  <!-- cars-service preview pod -->
  <rect x="540" y="272" width="220" height="104" rx="10" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="562" cy="296" r="11" fill="#756DF3"/>
  <text x="562" y="300.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="580" y="301" font-size="14" font-weight="700" fill="#232141">cars-service preview</text>
  <text x="650" y="330" font-size="12.5" fill="#333344" text-anchor="middle">temporary pod, your image</text>
  <text x="650" y="350" font-size="12.5" fill="#333344" text-anchor="middle">lives until the TTL expires</text>

  <!-- Filtered traffic to users-service preview -->
  <line x1="1080" y1="150" x2="1080" y2="268" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="1090" y="178" font-size="12.5" fill="#4a44b8">filtered by</text>
  <text x="1090" y="194" font-size="12.5" fill="#4a44b8">env key</text>

  <!-- users-service preview pod -->
  <rect x="920" y="272" width="220" height="104" rx="10" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="942" cy="296" r="11" fill="#756DF3"/>
  <text x="942" y="300.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="960" y="301" font-size="14" font-weight="700" fill="#232141">users-service preview</text>
  <text x="1030" y="330" font-size="12.5" fill="#333344" text-anchor="middle">temporary pod, your image</text>
  <text x="1030" y="350" font-size="12.5" fill="#333344" text-anchor="middle">lives until the TTL expires</text>

  <!-- CLI creates the preview -->
  <polyline points="390,135 450,135 450,306 506,306" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Kubernetes logos: what runs in the cluster -->
  <use href="#k8s" x="1162" y="2" width="36" height="36"/>
</svg>
