<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 572" width="1200" height="572" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Pub/Sub splitting with two mirrord sessions</title>
  <desc id="d">Publishers publish messages to original-topic. The mirrord forwarder in the operator reads original-subscription and applies the filters of both sessions. Messages that match tenant=alpha go to session-1-topic and session-1-sub, which mirrord 1 reads. Messages that match tenant=beta go to session-2-topic and session-2-sub, which mirrord 2 reads. Messages that match no filter go to main-output-topic and main-output-sub, which the target app reads.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
    <symbol id="k8s" viewBox="0 0 32 32">
      <polygon points="16.00,1.60 27.73,7.25 30.62,19.94 22.51,30.11 9.49,30.11 1.38,19.94 4.27,7.25" fill="#326CE5" stroke="#326CE5" stroke-width="2" stroke-linejoin="round"/>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <circle cx="16" cy="16" r="7"/>
        <line x1="16.00" y1="13.40" x2="16.00" y2="5.80"/><line x1="18.03" y1="14.38" x2="23.97" y2="9.64"/><line x1="18.53" y1="16.58" x2="25.94" y2="18.27"/><line x1="17.13" y1="18.34" x2="20.43" y2="25.19"/><line x1="14.87" y1="18.34" x2="11.57" y2="25.19"/><line x1="13.47" y1="16.58" x2="6.06" y2="18.27"/><line x1="13.97" y1="14.38" x2="8.03" y2="9.64"/>
      </g>
      <circle cx="16" cy="16" r="2.4" fill="#ffffff"/>
    </symbol>
  </defs>
  <rect x="0" y="0" width="1200" height="572" fill="#ffffff"/>

  <!-- Publishers, original topic, and original subscription -->
  <rect x="30" y="30" width="150" height="64" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="105" y="58" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Publishers</text>
  <text x="105" y="78" font-size="12.5" fill="#333344" text-anchor="middle">publish messages</text>
  <line x1="180" y1="62" x2="226" y2="62" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="230" y="30" width="200" height="64" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="330" y="58" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">original-topic</text>
  <text x="330" y="78" font-size="12.5" fill="#333344" text-anchor="middle">topic</text>
  <line x1="430" y1="62" x2="466" y2="62" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="470" y="30" width="260" height="64" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="600" y="58" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">original-subscription</text>
  <text x="600" y="78" font-size="12.5" fill="#333344" text-anchor="middle">subscription</text>

  <!-- The operator forwarder reads the original subscription -->
  <line x1="600" y1="94" x2="600" y2="130" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="470" y="134" width="260" height="64" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="600" y="162" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord forwarder</text>
  <text x="600" y="182" font-size="12.5" fill="#ffffff" text-anchor="middle">operator, applies session filters</text>

  <!-- Session 1: tenant=alpha -->
  <polyline points="560,198 560,230 200,230 200,266" fill="none" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="216" y="254" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#4a44b8" text-anchor="start">tenant=alpha</text>
  <rect x="70" y="270" width="260" height="64" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="200" y="298" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">session-1-topic</text>
  <text x="200" y="318" font-size="12.5" fill="#333344" text-anchor="middle">temporary topic</text>
  <line x1="200" y1="334" x2="200" y2="370" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="70" y="374" width="260" height="64" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="200" y="402" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">session-1-sub</text>
  <text x="200" y="422" font-size="12.5" fill="#333344" text-anchor="middle">temporary subscription</text>
  <line x1="200" y1="438" x2="200" y2="474" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="70" y="478" width="260" height="64" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="200" y="506" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord 1</text>
  <text x="200" y="526" font-size="12.5" fill="#ffffff" text-anchor="middle">user 1's local app</text>

  <!-- No match: main route to the target app -->
  <line x1="600" y1="198" x2="600" y2="266" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="616" y="254" font-size="12.5" fill="#333344" text-anchor="start">no match</text>
  <rect x="470" y="270" width="260" height="64" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="298" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">main-output-topic</text>
  <text x="600" y="318" font-size="12.5" fill="#333344" text-anchor="middle">temporary topic</text>
  <line x1="600" y1="334" x2="600" y2="370" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="470" y="374" width="260" height="64" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="402" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">main-output-sub</text>
  <text x="600" y="422" font-size="12.5" fill="#333344" text-anchor="middle">temporary subscription</text>
  <line x1="600" y1="438" x2="600" y2="474" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="470" y="478" width="260" height="64" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="600" y="506" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Target app</text>
  <text x="600" y="526" font-size="12.5" fill="#333344" text-anchor="middle">deployed consumer</text>

  <!-- Session 2: tenant=beta -->
  <polyline points="640,198 640,230 1000,230 1000,266" fill="none" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="1016" y="254" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#4a44b8" text-anchor="start">tenant=beta</text>
  <rect x="870" y="270" width="260" height="64" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1000" y="298" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">session-2-topic</text>
  <text x="1000" y="318" font-size="12.5" fill="#333344" text-anchor="middle">temporary topic</text>
  <line x1="1000" y1="334" x2="1000" y2="370" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="870" y="374" width="260" height="64" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1000" y="402" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">session-2-sub</text>
  <text x="1000" y="422" font-size="12.5" fill="#333344" text-anchor="middle">temporary subscription</text>
  <line x1="1000" y1="438" x2="1000" y2="474" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="870" y="478" width="260" height="64" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1000" y="506" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord 2</text>
  <text x="1000" y="526" font-size="12.5" fill="#ffffff" text-anchor="middle">user 2's local app</text>
  <use href="#k8s" x="702" y="142" width="20" height="20"/>
  <use href="#k8s" x="702" y="486" width="20" height="20"/>
</svg>
