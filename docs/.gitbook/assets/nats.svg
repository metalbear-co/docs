<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">NATS queue splitting flow</title>
  <desc id="d">Producers publish to orders.* into the stream ORDERS, which the app reads through the durable consumer orders-app. The operator never changes this stream. The forwarder in the mirrord operator pulls and acknowledges messages from orders-app and routes every message by each session's header or jq filter. A message that matches tenant=^acme$ goes to the temporary stream mirrord-tmp-&lt;a&gt;-orders-app, which developer A's local app reads. A message that matches tenant=^globex$ goes to mirrord-tmp-&lt;b&gt;-orders-app, which developer B's local app reads. A message that matches no filter goes to the fallback stream mirrord-tmp-main-orders-app, which the deployed consumer reads. The operator resolves the queue names from the pod environment or a mounted file, creates every temporary stream, patches only the pods and not the Deployment object, and cleans up when a session ends.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>

  <!-- Producers -->
  <rect x="460" y="20" width="280" height="64" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="600" y="47" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Producers</text>
  <text x="600" y="68" font-size="12.5" fill="#333344" text-anchor="middle">publish <tspan font-family="Menlo, Consolas, monospace" fill="#232141">orders.*</tspan></text>
  <line x1="600" y1="84" x2="600" y2="116" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Original stream and consumer -->
  <rect x="340" y="120" width="520" height="70" rx="12" fill="#FFCB7D" stroke="#232141" stroke-width="2"/>
  <text x="600" y="149" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Stream <tspan font-family="Menlo, Consolas, monospace">ORDERS</tspan> + durable consumer <tspan font-family="Menlo, Consolas, monospace">orders-app</tspan></text>
  <text x="600" y="172" font-size="12.5" fill="#333344" text-anchor="middle">the app's real JetStream queue, never modified</text>
  <line x1="600" y1="190" x2="600" y2="236" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="612" y="218" font-size="12.5" fill="#333344">forwarder pulls and acks</text>

  <!-- mirrord operator, which runs the forwarder -->
  <rect x="900" y="20" width="280" height="150" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1040" y="50" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord operator</text>
  <text x="1040" y="76" font-size="12.5" fill="#ffffff" text-anchor="middle">resolves the names from pod env</text>
  <text x="1040" y="94" font-size="12.5" fill="#ffffff" text-anchor="middle">or a mounted file, creates every</text>
  <text x="1040" y="112" font-size="12.5" fill="#ffffff" text-anchor="middle">temporary stream, patches only the pods</text>
  <text x="1040" y="130" font-size="12.5" fill="#ffffff" text-anchor="middle">(the Deployment object stays as it is),</text>
  <text x="1040" y="148" font-size="12.5" fill="#ffffff" text-anchor="middle">cleans up when a session ends</text>
  <polyline points="1040,170 1040,275 864,275" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1052" y="230" font-size="12.5" fill="#333344">runs</text>

  <!-- Forwarder -->
  <rect x="340" y="240" width="520" height="70" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="600" y="269" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Forwarder</text>
  <text x="600" y="292" font-size="12.5" fill="#ffffff" text-anchor="middle">routes every message by each session's header or jq filter</text>

  <!-- Routes from the forwarder -->
  <polyline points="480,310 480,340 200,340 200,396" fill="none" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="212" y="374" font-size="12.5" fill="#4a44b8">matches <tspan font-family="Menlo, Consolas, monospace">tenant=^acme$</tspan></text>
  <line x1="600" y1="310" x2="600" y2="396" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="612" y="374" font-size="12.5" fill="#333344">no filter matched</text>
  <polyline points="720,310 720,340 1000,340 1000,396" fill="none" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="988" y="374" font-size="12.5" fill="#4a44b8" text-anchor="end">matches <tspan font-family="Menlo, Consolas, monospace">tenant=^globex$</tspan></text>

  <!-- Temporary streams -->
  <rect x="20" y="400" width="360" height="70" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="200" y="429" font-size="14" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">mirrord-tmp-&lt;a&gt;-orders-app</text>
  <text x="200" y="452" font-size="12.5" fill="#333344" text-anchor="middle">session A's own stream + durable consumer</text>
  <rect x="420" y="400" width="360" height="70" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="429" font-size="14" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">mirrord-tmp-main-orders-app</text>
  <text x="600" y="452" font-size="12.5" fill="#333344" text-anchor="middle">fallback: every unmatched message</text>
  <rect x="820" y="400" width="360" height="70" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1000" y="429" font-size="14" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">mirrord-tmp-&lt;b&gt;-orders-app</text>
  <text x="1000" y="452" font-size="12.5" fill="#333344" text-anchor="middle">session B's own stream + durable consumer</text>

  <!-- Readers -->
  <line x1="200" y1="470" x2="200" y2="516" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <line x1="600" y1="470" x2="600" y2="516" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1000" y1="470" x2="1000" y2="516" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="20" y="520" width="360" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="200" y="548" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Developer A's local app</text>
  <text x="200" y="569" font-size="12.5" fill="#ffffff" text-anchor="middle">its env vars or mounted config file</text>
  <text x="200" y="587" font-size="12.5" fill="#ffffff" text-anchor="middle">are rewritten to point at A's stream</text>
  <rect x="420" y="520" width="360" height="80" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="600" y="548" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Deployed consumer (patched pods)</text>
  <text x="600" y="569" font-size="12.5" fill="#333344" text-anchor="middle">points at the fallback names, through an env</text>
  <text x="600" y="587" font-size="12.5" fill="#333344" text-anchor="middle">rewrite or a rewritten ConfigMap copy</text>
  <rect x="820" y="520" width="360" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1000" y="548" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Developer B's local app</text>
  <text x="1000" y="569" font-size="12.5" fill="#ffffff" text-anchor="middle">same mechanism, with B's own stream;</text>
  <text x="1000" y="587" font-size="12.5" fill="#ffffff" text-anchor="middle">sessions never see each other's messages</text>
</svg>
