<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Azure Service Bus topic splitting flow</title>
  <desc id="d">Pass 1, intake: the producer publishes messages with no routing marker to test-topic. The temporary ingest subscription mirrord-ingest-* has the rule route IS NULL, so it captures the raw messages. The mirrord forwarder in the operator reads them and applies the filter, a header regex plus jq over the body. It stamps mirrord_route on each message: matched messages get route = the session id, and unmatched messages get route = main. The forwarder re-publishes each message to the same topic. Pass 2, delivery: the session subscription mirrord-s-* has the rule route = the session id and delivers matched messages to the developer running mirrord exec. The app subscription test-sub has the rule route = main and delivers unmatched messages to the deployed app, which is unchanged and not restarted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>

  <!-- Pass 1: intake -->
  <text x="20" y="32" font-size="15" font-weight="700" fill="#4a44b8" text-anchor="start">Pass 1: intake (capture raw messages)</text>
  <rect x="20" y="50" width="150" height="80" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="95" y="86" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Producer</text>
  <text x="95" y="106" font-size="12.5" fill="#333344" text-anchor="middle">app sending messages</text>
  <line x1="170" y1="90" x2="262" y2="90" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="216" y="62" font-size="12.5" fill="#333344" text-anchor="middle">publish</text>
  <text x="216" y="76" font-size="12.5" fill="#333344" text-anchor="middle">(no marker)</text>
  <rect x="266" y="50" width="170" height="80" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="351" y="86" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">test-topic</text>
  <text x="351" y="106" font-size="12.5" fill="#333344" text-anchor="middle">topic, pass 1: raw</text>
  <line x1="436" y1="90" x2="568" y2="90" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="502" y="62" font-size="12.5" fill="#4a44b8" text-anchor="middle">matches</text>
  <text x="502" y="76" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#4a44b8" text-anchor="middle">route IS NULL</text>
  <rect x="572" y="50" width="220" height="80" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="682" y="77" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Ingest subscription</text>
  <text x="682" y="97" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">mirrord-ingest-*</text>
  <text x="682" y="115" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">rule: route IS NULL</text>
  <line x1="792" y1="90" x2="898" y2="90" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="845" y="62" font-size="12.5" fill="#4a44b8" text-anchor="middle">operator reads</text>
  <text x="845" y="76" font-size="12.5" fill="#4a44b8" text-anchor="middle">+ filters</text>
  <rect x="902" y="50" width="274" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1039" y="77" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord forwarder</text>
  <text x="1039" y="97" font-size="12.5" fill="#ffffff" text-anchor="middle">filter: header regex</text>
  <text x="1039" y="115" font-size="12.5" fill="#ffffff" text-anchor="middle">+ jq over body</text>

  <!-- The three example messages the producer sends -->
  <rect x="20" y="170" width="216" height="92" rx="10" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="128" y="194" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">Producer sends 3 messages</text>
  <text x="128" y="214" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">matched-1 | tenant=test</text>
  <text x="128" y="232" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">unmatched | tenant=other</text>
  <text x="128" y="250" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">matched-2 | tenant=test</text>

  <!-- The forwarder stamps a routing marker on each message -->
  <line x1="1039" y1="130" x2="1039" y2="196" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="1027" y="168" font-size="12.5" fill="#4a44b8" text-anchor="end">stamps <tspan font-family="Menlo, Consolas, monospace">mirrord_route</tspan></text>
  <rect x="902" y="200" width="274" height="100" rx="10" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="1039" y="228" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">Forwarder re-tags each message</text>
  <text x="1039" y="248" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">matched-1 → route=&lt;session-id&gt;</text>
  <text x="1039" y="266" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">matched-2 → route=&lt;session-id&gt;</text>
  <text x="1039" y="284" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">unmatched → route=main</text>

  <!-- Re-publish to the same topic -->
  <polyline points="1039,300 1039,334 351,334 351,416" fill="none" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="695" y="324" font-size="12.5" fill="#4a44b8" text-anchor="middle">re-publish to the same topic</text>

  <!-- Pass 2: delivery -->
  <text x="20" y="392" font-size="15" font-weight="700" fill="#4a44b8" text-anchor="start">Pass 2: delivery (route tagged copies)</text>
  <rect x="266" y="420" width="170" height="80" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="351" y="456" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">test-topic</text>
  <text x="351" y="476" font-size="12.5" fill="#333344" text-anchor="middle">topic, pass 2: fan-out</text>

  <!-- Matched copies: session subscription to the developer -->
  <polyline points="436,445 470,445 470,410 596,410" fill="none" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="530" y="396" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#4a44b8" text-anchor="middle">route = &lt;id&gt;</text>
  <rect x="600" y="370" width="230" height="80" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="715" y="397" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Session subscription</text>
  <text x="715" y="417" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">mirrord-s-*</text>
  <text x="715" y="435" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">rule: route = &lt;id&gt;</text>
  <line x1="830" y1="410" x2="956" y2="410" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="889" y="396" font-size="12.5" fill="#4a44b8" text-anchor="middle">matched messages</text>
  <rect x="960" y="370" width="216" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1068" y="406" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Developer</text>
  <text x="1068" y="426" font-size="12.5" fill="#ffffff" text-anchor="middle">mirrord exec</text>

  <!-- Unmatched copies: app subscription to the deployed app -->
  <polyline points="436,475 470,475 470,530 596,530" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="530" y="516" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">route = main</text>
  <rect x="600" y="490" width="230" height="80" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="715" y="517" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">App subscription</text>
  <text x="715" y="537" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">test-sub</text>
  <text x="715" y="555" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">rule: route = 'main'</text>
  <line x1="830" y1="530" x2="956" y2="530" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="889" y="502" font-size="12.5" fill="#333344" text-anchor="middle">unmatched</text>
  <text x="889" y="516" font-size="12.5" fill="#333344" text-anchor="middle">(production)</text>
  <rect x="960" y="490" width="216" height="80" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="1068" y="526" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Deployed app</text>
  <text x="1068" y="546" font-size="12.5" fill="#333344" text-anchor="middle">unchanged, not restarted</text>
</svg>
