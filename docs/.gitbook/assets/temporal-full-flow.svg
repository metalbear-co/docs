<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Temporal queue splitting full system flow</title>
  <desc id="d">One Temporal server holds the real task queues checkout, shipping, billing, notify, reports, and audit. The mirrord operator polls Temporal, filters and routes the tasks, and serves them to Worker 1, which runs with mirrord. Worker 1 reads four queues: checkout and shipping are split, and billing and notify pass through without a split. Worker 2 runs without mirrord and polls the reports and audit queues directly from Temporal. The operator is not involved for Worker 2.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="450" fill="#ffffff"/>

  <!-- Temporal server -->
  <rect x="20" y="60" width="240" height="140" rx="12" fill="#FFCB7D" stroke="#232141" stroke-width="2"/>
  <text x="140" y="92" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Temporal server</text>
  <text x="140" y="116" font-size="12.5" fill="#333344" text-anchor="middle">real task queues:</text>
  <text x="140" y="140" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">checkout, shipping,</text>
  <text x="140" y="158" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">billing, notify,</text>
  <text x="140" y="176" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">reports, audit</text>

  <!-- Temporal to operator -->
  <line x1="260" y1="130" x2="336" y2="130" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="298" y="118" font-size="12.5" fill="#4a44b8" text-anchor="middle">poll</text>

  <!-- mirrord operator -->
  <rect x="340" y="90" width="240" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="460" y="124" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord operator</text>
  <text x="460" y="146" font-size="12.5" fill="#ffffff" text-anchor="middle">poll → filter → route → serve</text>

  <!-- Operator to Worker 1 -->
  <line x1="580" y1="130" x2="656" y2="130" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="618" y="118" font-size="12.5" fill="#4a44b8" text-anchor="middle">serve</text>

  <!-- Worker 1 with its four queues -->
  <rect x="660" y="20" width="520" height="240" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="680" y="50" font-size="16" font-weight="700" fill="#232141">Worker 1</text>
  <text x="680" y="70" font-size="12.5" fill="#333344">split enabled, runs with mirrord</text>
  <rect x="680" y="86" width="230" height="56" rx="8" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="795" y="110" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">checkout</text>
  <text x="795" y="129" font-size="12.5" fill="#4a44b8" text-anchor="middle">split</text>
  <rect x="930" y="86" width="230" height="56" rx="8" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="1045" y="110" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">shipping</text>
  <text x="1045" y="129" font-size="12.5" fill="#4a44b8" text-anchor="middle">split</text>
  <rect x="680" y="156" width="230" height="56" rx="8" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="795" y="180" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">billing</text>
  <text x="795" y="199" font-size="12.5" fill="#333344" text-anchor="middle">not split</text>
  <rect x="930" y="156" width="230" height="56" rx="8" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="1045" y="180" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">notify</text>
  <text x="1045" y="199" font-size="12.5" fill="#333344" text-anchor="middle">not split</text>
  <text x="680" y="240" font-size="12.5" fill="#333344">4 queues in one worker: 2 split, 2 pass through</text>

  <!-- Temporal to Worker 2, no mirrord -->
  <polyline points="140,200 140,370 656,370" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="400" y="358" font-size="12.5" fill="#333344" text-anchor="middle">poll directly, operator not involved</text>

  <!-- Worker 2 with its two queues -->
  <rect x="660" y="300" width="520" height="130" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="680" y="330" font-size="16" font-weight="700" fill="#232141">Worker 2</text>
  <text x="680" y="350" font-size="12.5" fill="#333344">runs without mirrord</text>
  <rect x="680" y="366" width="230" height="44" rx="8" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="795" y="393" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">reports</text>
  <rect x="930" y="366" width="230" height="44" rx="8" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="1045" y="393" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">audit</text>
</svg>
