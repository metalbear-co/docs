<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">BullMQ queue splitting flow</title>
  <desc id="d">A producer app pushes a job ID with RPUSH to the Redis list bull:orders:wait. The job data is in the hash bull:orders:&lt;jobId&gt;. The BullMQ forwarder in the mirrord operator takes job IDs from the wait list with BLPOP, reads the job data with HGETALL, and checks the data JSON field against the users' filters. A job that matches a filter is pushed with RPUSH to the per-session queue bull:mirrord-tmp-&lt;session&gt;-orders:wait, which your local process reads with BLPOP. A job that matches no filter is pushed with RPUSH to the main queue bull:mirrord-tmp-&lt;main&gt;-orders:wait, which the deployed workload reads with BLPOP after the operator patches its queue-name environment variable.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="400" fill="#ffffff"/>

  <!-- Producer -->
  <rect x="60" y="30" width="180" height="64" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="150" y="68" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Producer app</text>
  <line x1="150" y1="94" x2="150" y2="156" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="162" y="130" font-size="12.5" fill="#333344"><tspan font-family="Menlo, Consolas, monospace">RPUSH</tspan> job ID</text>

  <!-- Redis -->
  <rect x="20" y="160" width="260" height="220" rx="12" fill="#FFCB7D" stroke="#232141" stroke-width="2"/>
  <text x="150" y="188" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Redis</text>
  <rect x="36" y="204" width="228" height="58" rx="8" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="150" y="228" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">bull:orders:wait</text>
  <text x="150" y="248" font-size="12.5" fill="#333344" text-anchor="middle">list of job IDs</text>
  <rect x="36" y="276" width="228" height="88" rx="8" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="150" y="300" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">bull:orders:&lt;jobId&gt;</text>
  <text x="150" y="320" font-size="12.5" fill="#333344" text-anchor="middle">hash</text>
  <text x="150" y="344" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">data: {"tenant":"x",...}</text>

  <!-- Redis to forwarder -->
  <line x1="280" y1="270" x2="346" y2="270" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="313" y="258" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">BLPOP</text>

  <!-- Forwarder -->
  <rect x="350" y="180" width="220" height="190" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="460" y="214" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord operator</text>
  <text x="460" y="236" font-size="12.5" fill="#ffffff" text-anchor="middle">BullMQ forwarder</text>
  <text x="460" y="280" font-size="12.5" fill="#ffffff" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">HGETALL</tspan> reads job data</text>
  <text x="460" y="302" font-size="12.5" fill="#ffffff" text-anchor="middle">inspects the <tspan font-family="Menlo, Consolas, monospace">data</tspan> JSON field</text>
  <text x="460" y="324" font-size="12.5" fill="#ffffff" text-anchor="middle">checks the users' filters</text>

  <!-- Match: per-session queue to your local process -->
  <line x1="570" y1="230" x2="646" y2="230" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="608" y="202" font-size="12.5" fill="#4a44b8" text-anchor="middle">match</text>
  <text x="608" y="220" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#4a44b8" text-anchor="middle">RPUSH</text>
  <rect x="650" y="190" width="230" height="80" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="765" y="212" font-size="12.5" fill="#333344" text-anchor="middle">per-session queue</text>
  <text x="765" y="234" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">bull:mirrord-tmp-&lt;session&gt;</text>
  <text x="765" y="252" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">-orders:wait</text>
  <line x1="880" y1="230" x2="946" y2="230" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="913" y="218" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#4a44b8" text-anchor="middle">BLPOP</text>
  <rect x="950" y="190" width="230" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1065" y="226" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Your local process</text>
  <text x="1065" y="248" font-size="12.5" fill="#ffffff" text-anchor="middle">runs with <tspan font-family="Menlo, Consolas, monospace">mirrord exec</tspan></text>

  <!-- No match: main queue to the deployed workload -->
  <line x1="570" y1="330" x2="646" y2="330" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="608" y="302" font-size="12.5" fill="#333344" text-anchor="middle">no match</text>
  <text x="608" y="320" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">RPUSH</text>
  <rect x="650" y="290" width="230" height="80" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="765" y="312" font-size="12.5" fill="#333344" text-anchor="middle">main queue</text>
  <text x="765" y="334" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">bull:mirrord-tmp-&lt;main&gt;</text>
  <text x="765" y="352" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">-orders:wait</text>
  <line x1="880" y1="330" x2="946" y2="330" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="913" y="318" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">BLPOP</text>
  <rect x="950" y="290" width="230" height="80" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="1065" y="322" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Deployed workload</text>
  <text x="1065" y="344" font-size="12.5" fill="#333344" text-anchor="middle">queue env var patched</text>
</svg>
