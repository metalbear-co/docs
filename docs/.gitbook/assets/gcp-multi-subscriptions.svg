<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 806" width="1200" height="806" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One queue ID matching two Pub/Sub subscriptions</title>
  <desc id="d">One queue ID uses envLike "^SUBSCRIPTION_", which matches SUBSCRIPTION_A=sub-a and SUBSCRIPTION_B=sub-b. Each subscription is split on its own. In stream A, Publishers A publish to topic-a, and forwarder A reads sub-a. Matched messages go to session-topic-A and session-sub-A, which mirrord 1 reads. Unmatched messages go to main-topic-A and main-sub-A, which the target app reads. Stream B works the same way with topic-b, sub-b, forwarder B, session-topic-B, session-sub-B, main-topic-B, and main-sub-B. The same mirrord 1 session gets the matched messages from both streams, and the same target app gets the unmatched messages from both.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
    <symbol id="k8s" viewBox="0 0 32 32">
      <polygon points="16.00,1.60 27.73,7.25 30.62,19.94 22.51,30.11 9.49,30.11 1.38,19.94 4.27,7.25" fill="#326CE5" stroke="#326CE5" stroke-width="2" stroke-linejoin="round"/>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <circle cx="16" cy="16" r="7"/>
        <line x1="16.00" y1="13.40" x2="16.00" y2="5.80"/><line x1="18.03" y1="14.38" x2="23.97" y2="9.64"/><line x1="18.53" y1="16.58" x2="25.94" y2="18.27"/><line x1="17.13" y1="18.34" x2="20.43" y2="25.19"/><line x1="14.87" y1="18.34" x2="11.57" y2="25.19"/><line x1="13.47" y1="16.58" x2="6.06" y2="18.27"/><line x1="13.97" y1="14.38" x2="8.03" y2="9.64"/>
      </g>
      <circle cx="16" cy="16" r="2.4" fill="#ffffff"/>
    </symbol>
  </defs>
  <rect x="0" y="0" width="1200" height="806" fill="#ffffff"/>

  <!-- envLike note -->
  <text x="600" y="28" font-size="12.5" fill="#333344" text-anchor="middle">One queue ID: <tspan font-family="Menlo, Consolas, monospace">envLike: "^SUBSCRIPTION_"</tspan> matches two variables, and mirrord splits each subscription on its own</text>

  <!-- Stream A: SUBSCRIPTION_A=sub-a -->
  <text x="30" y="60" font-size="15" font-weight="700" fill="#4a44b8" text-anchor="start">Stream A</text>
  <text x="112" y="60" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#4a44b8" text-anchor="start">SUBSCRIPTION_A=sub-a</text>
  <rect x="180" y="78" width="240" height="56" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="300" y="111" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Publishers A</text>
  <line x1="300" y1="134" x2="300" y2="162" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="180" y="166" width="240" height="56" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="300" y="190" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">topic-a</text>
  <text x="300" y="210" font-size="12.5" fill="#333344" text-anchor="middle">topic</text>
  <line x1="300" y1="222" x2="300" y2="250" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="180" y="254" width="240" height="56" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="300" y="278" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">sub-a</text>
  <text x="300" y="298" font-size="12.5" fill="#333344" text-anchor="middle">original subscription</text>
  <line x1="300" y1="310" x2="300" y2="338" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="180" y="342" width="240" height="56" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="300" y="366" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord forwarder A</text>
  <text x="300" y="386" font-size="12.5" fill="#ffffff" text-anchor="middle">reads sub-a, applies the filter</text>
  <polyline points="340,398 340,426 450,426 450,458" fill="none" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="466" y="449" font-size="12.5" fill="#4a44b8" text-anchor="start">matched</text>
  <rect x="330" y="462" width="240" height="56" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="450" y="486" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">session-topic-A</text>
  <text x="450" y="506" font-size="12.5" fill="#333344" text-anchor="middle">temporary topic</text>
  <line x1="450" y1="518" x2="450" y2="546" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="330" y="550" width="240" height="56" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="450" y="574" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">session-sub-A</text>
  <text x="450" y="594" font-size="12.5" fill="#333344" text-anchor="middle">temporary subscription</text>
  <line x1="450" y1="606" x2="450" y2="634" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <polyline points="260,398 260,426 150,426 150,458" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="166" y="449" font-size="12.5" fill="#333344" text-anchor="start">unmatched</text>
  <rect x="30" y="462" width="240" height="56" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="150" y="486" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">main-topic-A</text>
  <text x="150" y="506" font-size="12.5" fill="#333344" text-anchor="middle">temporary topic</text>
  <line x1="150" y1="518" x2="150" y2="546" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="30" y="550" width="240" height="56" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="150" y="574" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">main-sub-A</text>
  <text x="150" y="594" font-size="12.5" fill="#333344" text-anchor="middle">temporary subscription</text>
  <line x1="150" y1="606" x2="150" y2="722" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stream B: SUBSCRIPTION_B=sub-b -->
  <text x="630" y="60" font-size="15" font-weight="700" fill="#4a44b8" text-anchor="start">Stream B</text>
  <text x="712" y="60" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#4a44b8" text-anchor="start">SUBSCRIPTION_B=sub-b</text>
  <rect x="780" y="78" width="240" height="56" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="900" y="111" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Publishers B</text>
  <line x1="900" y1="134" x2="900" y2="162" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="780" y="166" width="240" height="56" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="900" y="190" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">topic-b</text>
  <text x="900" y="210" font-size="12.5" fill="#333344" text-anchor="middle">topic</text>
  <line x1="900" y1="222" x2="900" y2="250" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="780" y="254" width="240" height="56" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="900" y="278" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">sub-b</text>
  <text x="900" y="298" font-size="12.5" fill="#333344" text-anchor="middle">original subscription</text>
  <line x1="900" y1="310" x2="900" y2="338" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="780" y="342" width="240" height="56" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="900" y="366" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord forwarder B</text>
  <text x="900" y="386" font-size="12.5" fill="#ffffff" text-anchor="middle">reads sub-b, applies the filter</text>
  <polyline points="860,398 860,426 750,426 750,458" fill="none" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="766" y="449" font-size="12.5" fill="#4a44b8" text-anchor="start">matched</text>
  <rect x="630" y="462" width="240" height="56" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="750" y="486" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">session-topic-B</text>
  <text x="750" y="506" font-size="12.5" fill="#333344" text-anchor="middle">temporary topic</text>
  <line x1="750" y1="518" x2="750" y2="546" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="630" y="550" width="240" height="56" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="750" y="574" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">session-sub-B</text>
  <text x="750" y="594" font-size="12.5" fill="#333344" text-anchor="middle">temporary subscription</text>
  <line x1="750" y1="606" x2="750" y2="634" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <polyline points="940,398 940,426 1050,426 1050,458" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1066" y="449" font-size="12.5" fill="#333344" text-anchor="start">unmatched</text>
  <rect x="930" y="462" width="240" height="56" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1050" y="486" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">main-topic-B</text>
  <text x="1050" y="506" font-size="12.5" fill="#333344" text-anchor="middle">temporary topic</text>
  <line x1="1050" y1="518" x2="1050" y2="546" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="930" y="550" width="240" height="56" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1050" y="574" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">main-sub-B</text>
  <text x="1050" y="594" font-size="12.5" fill="#333344" text-anchor="middle">temporary subscription</text>
  <line x1="1050" y1="606" x2="1050" y2="722" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- One local session and one target app receive both streams -->
  <rect x="330" y="638" width="540" height="56" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="600" y="662" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord 1</text>
  <text x="600" y="682" font-size="12.5" fill="#ffffff" text-anchor="middle">local app, gets matched messages from both streams</text>
  <rect x="30" y="726" width="1140" height="56" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="600" y="750" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Target app</text>
  <text x="600" y="770" font-size="12.5" fill="#333344" text-anchor="middle">deployed consumer, reads main-sub-A and main-sub-B</text>
  <use href="#k8s" x="392" y="350" width="20" height="20"/>
  <use href="#k8s" x="992" y="350" width="20" height="20"/>
  <use href="#k8s" x="1142" y="734" width="20" height="20"/>
</svg>
