<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1202 490" width="1202" height="490" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">mirrord basic architecture</title>
  <desc id="d">Your local process runs on your machine with mirrord-layer loaded into it. In the Kubernetes cluster, the mirrord agent runs with the target pod. Internet traffic and traffic from other services reach the target pod. The agent sends incoming traffic to your local process. Your local process sends outgoing traffic, database access, and file reads and writes to the agent. The agent sends that outgoing traffic to other services and that database access to the database, as if it came from the target pod.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
    <symbol id="k8s" viewBox="0 0 32 32">
      <polygon points="16.00,1.60 27.73,7.25 30.62,19.94 22.51,30.11 9.49,30.11 1.38,19.94 4.27,7.25" fill="#326CE5" stroke="#326CE5" stroke-width="2" stroke-linejoin="round"/>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <circle cx="16" cy="16" r="7"/>
        <line x1="16.00" y1="13.40" x2="16.00" y2="5.80"/><line x1="18.03" y1="14.38" x2="23.97" y2="9.64"/><line x1="18.53" y1="16.58" x2="25.94" y2="18.27"/><line x1="17.13" y1="18.34" x2="20.43" y2="25.19"/><line x1="14.87" y1="18.34" x2="11.57" y2="25.19"/><line x1="13.47" y1="16.58" x2="6.06" y2="18.27"/><line x1="13.97" y1="14.38" x2="8.03" y2="9.64"/>
      </g>
      <circle cx="16" cy="16" r="2.4" fill="#ffffff"/>
    </symbol>
  </defs>
  <rect x="0" y="0" width="1202" height="490" fill="#ffffff"/>

  <!-- Boundaries -->
  <rect x="20" y="170" width="280" height="270" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="44" y="198" font-size="15" font-weight="700" fill="#4a44b8">Your machine</text>
  <rect x="470" y="110" width="710" height="360" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="494" y="138" font-size="15" font-weight="700" fill="#4a44b8">Kubernetes cluster</text>

  <!-- Local process with mirrord-layer -->
  <rect x="45" y="220" width="230" height="190" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="160" y="262" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Your local process</text>
  <rect x="70" y="310" width="180" height="70" rx="8" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="160" y="341" font-size="14" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#ffffff" text-anchor="middle">mirrord-layer</text>
  <text x="160" y="362" font-size="12.5" fill="#ffffff" text-anchor="middle">loaded into the process</text>

  <!-- Internet traffic -->
  <rect x="620" y="20" width="200" height="56" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="720" y="54" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Internet</text>
  <line x1="720" y1="76" x2="720" y2="176" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="732" y="100" font-size="12.5" fill="#333344">incoming traffic</text>

  <!-- Target pod with the mirrord agent -->
  <rect x="590" y="180" width="260" height="260" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="720" y="206" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Target pod</text>
  <rect x="615" y="222" width="210" height="76" rx="10" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="720" y="266" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord agent</text>
  <rect x="615" y="350" width="210" height="70" rx="10" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="720" y="391" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Deployed container</text>

  <!-- Agent and local process -->
  <line x1="615" y1="252" x2="279" y2="252" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="385" y="242" font-size="12.5" fill="#4a44b8" text-anchor="middle">incoming traffic</text>
  <line x1="275" y1="282" x2="611" y2="282" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="385" y="304" font-size="12.5" fill="#333344" text-anchor="middle">outgoing traffic</text>
  <text x="385" y="320" font-size="12.5" fill="#333344" text-anchor="middle">DB access</text>
  <text x="385" y="336" font-size="12.5" fill="#333344" text-anchor="middle">file reads and writes</text>

  <!-- Other services and database -->
  <rect x="1020" y="160" width="140" height="86" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="1090" y="198" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Other</text>
  <text x="1090" y="218" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">services</text>
  <line x1="1020" y1="190" x2="854" y2="190" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="935" y="182" font-size="12.5" fill="#333344" text-anchor="middle">incoming traffic</text>
  <line x1="825" y1="234" x2="1016" y2="234" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="935" y="226" font-size="12.5" fill="#333344" text-anchor="middle">outgoing traffic</text>
  <polyline points="825,276 1090,276 1090,334" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="935" y="268" font-size="12.5" fill="#333344" text-anchor="middle">DB access</text>
  <path d="M1020 352 L1020 428 A70 14 0 0 0 1160 428 L1160 352" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <ellipse cx="1090" cy="352" rx="70" ry="14" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="1090" y="402" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Database</text>
  <!-- Kubernetes logos: what runs in the cluster -->
  <use href="#k8s" x="1162" y="92" width="36" height="36"/>
</svg>
