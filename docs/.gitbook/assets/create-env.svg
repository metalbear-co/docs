<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Preview environment creation workflow</title>
  <desc id="d">Step 1: on your machine, you run mirrord preview start with a container image from a registry, a mirrord.json file, and an optional env key. Step 2: mirrord.json steals incoming traffic with a header filter, and mirrord replaces {{ key }} in every filter with the env key. The CLI prints the env key and the preview session. Step 3: in the staging cluster, a temporary cars-service preview pod starts with your image and lives until its TTL expires. Requests to cars-service that match the env key filter go to the preview pod.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
    <symbol id="k8s" viewBox="0 0 32 32">
      <polygon points="16.00,1.60 27.73,7.25 30.62,19.94 22.51,30.11 9.49,30.11 1.38,19.94 4.27,7.25" fill="#326CE5" stroke="#326CE5" stroke-width="2" stroke-linejoin="round"/>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <circle cx="16" cy="16" r="7"/>
        <line x1="16.00" y1="13.40" x2="16.00" y2="5.80"/><line x1="18.03" y1="14.38" x2="23.97" y2="9.64"/><line x1="18.53" y1="16.58" x2="25.94" y2="18.27"/><line x1="17.13" y1="18.34" x2="20.43" y2="25.19"/><line x1="14.87" y1="18.34" x2="11.57" y2="25.19"/><line x1="13.47" y1="16.58" x2="6.06" y2="18.27"/><line x1="13.97" y1="14.38" x2="8.03" y2="9.64"/>
      </g>
      <circle cx="16" cy="16" r="2.4" fill="#ffffff"/>
    </symbol>
  </defs>
  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>

  <!-- Your machine -->
  <rect x="20" y="20" width="540" height="620" rx="16" fill="#F5F4FE" stroke="#756DF3" stroke-width="2"/>
  <text x="40" y="48" font-size="15" font-weight="700" fill="#4a44b8">Your machine</text>

  <!-- The command -->
  <rect x="40" y="64" width="500" height="166" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <circle cx="62" cy="88" r="11" fill="#756DF3"/>
  <text x="62" y="92.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="80" y="93" font-size="14" font-weight="700" fill="#232141">Create a preview</text>
  <text x="60" y="116" font-size="12.5"  fill="#333344" xml:space="preserve">Inputs: a container image in a registry, a mirrord.json file,</text>
  <text x="60" y="133" font-size="12.5"  fill="#333344" xml:space="preserve">and an optional env key.</text>
  <text x="60" y="158" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">mirrord preview start</text>
  <text x="60" y="175" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">  --config-file &lt;mirrord.json&gt;</text>
  <text x="60" y="192" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">  --image &lt;code-image&gt;</text>
  <text x="60" y="209" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">  --key &lt;env-key&gt;   (optional)</text>

  <!-- mirrord.json -->
  <rect x="40" y="246" width="500" height="196" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <circle cx="62" cy="270" r="11" fill="#756DF3"/>
  <text x="62" y="274.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="80" y="275" font-size="14" font-weight="700" fill="#232141" font-family="Menlo, Consolas, monospace">mirrord.json</text>
  <text x="60" y="300" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">{</text>
  <text x="60" y="315" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">  "feature": {</text>
  <text x="60" y="330" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">    "network": {</text>
  <text x="60" y="345" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">      "incoming": {</text>
  <text x="60" y="360" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">        "mode": "steal",</text>
  <text x="60" y="375" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">        "http_filter": {</text>
  <text x="60" y="390" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#4a44b8" xml:space="preserve">          "header_filter": "key-{{ key }}"</text>
  <text x="60" y="405" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">} } } } }</text>
  <text x="330" y="300" font-size="12.5"  fill="#333344" xml:space="preserve">mirrord replaces</text>
  <text x="330" y="317" font-size="12.5"  fill="#333344" xml:space="preserve">{{ key }} with the</text>
  <text x="330" y="334" font-size="12.5"  fill="#333344" xml:space="preserve">env key, in every</text>
  <text x="330" y="351" font-size="12.5"  fill="#333344" xml:space="preserve">filter in the file.</text>

  <!-- CLI output -->
  <rect x="40" y="458" width="500" height="166" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="60" y="484" font-size="14" font-weight="700" fill="#232141">Output</text>
  <text x="60" y="510" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">✓ mirrord preview start</text>
  <text x="60" y="527" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">  ✓ preview session resource created</text>
  <text x="60" y="544" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">  ✓ preview pod is ready</text>
  <text x="60" y="561" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">info:</text>
  <text x="60" y="578" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">  * key: &lt;env-key&gt;</text>
  <text x="60" y="595" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" xml:space="preserve">  * session: preview-session-cars-service-&lt;id&gt;</text>

  <!-- Staging cluster -->
  <rect x="600" y="20" width="580" height="620" rx="16" fill="#F5F4FE" stroke="#756DF3" stroke-width="2"/>
  <text x="620" y="48" font-size="15" font-weight="700" fill="#4a44b8">Staging cluster</text>

  <!-- Deployed services -->
  <rect x="640" y="80" width="200" height="80" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="740" y="116" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">cars-service</text>
  <text x="740" y="136" font-size="12.5" fill="#333344" text-anchor="middle">deployed</text>
  <rect x="960" y="80" width="200" height="80" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="1060" y="116" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">users-service</text>
  <text x="1060" y="136" font-size="12.5" fill="#333344" text-anchor="middle">deployed</text>
  <line x1="840" y1="108" x2="956" y2="108" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="960" y1="134" x2="844" y2="134" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Preview environment -->
  <rect x="620" y="250" width="540" height="300" rx="14" fill="#ffffff" stroke="#756DF3" stroke-width="2"/>
  <text x="640" y="278" font-size="15" font-weight="700" fill="#4a44b8">Preview environment</text>
  <text x="640" y="296" font-size="12.5" fill="#333344">one env key</text>

  <!-- Filtered traffic to the preview pods -->
  <line x1="800" y1="160" x2="800" y2="336" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="810" y="196" font-size="12.5" fill="#4a44b8" text-anchor="start">filtered by</text>
  <text x="810" y="212" font-size="12.5" fill="#4a44b8" text-anchor="start">env key</text>
  <rect x="640" y="340" width="220" height="110" rx="10" fill="#ffffff" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="662" cy="364" r="11" fill="#756DF3"/>
  <text x="662" y="368.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="680" y="369" font-size="14" font-weight="700" fill="#232141">cars-service preview</text>
  <text x="750" y="398" font-size="12.5" fill="#333344" text-anchor="middle">temporary pod, your image</text>
  <text x="750" y="416" font-size="12.5" fill="#333344" text-anchor="middle">lives until the TTL expires</text>
  <text x="890" y="500" font-size="12.5" fill="#333344" text-anchor="middle">Requests without the env key still reach the deployed services.</text>

  <!-- The CLI starts the preview -->
  <polyline points="540,140 580,140 580,395 616,395" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Kubernetes logos: what runs in the cluster -->
  <use href="#k8s" x="1162" y="2" width="36" height="36"/>
</svg>
