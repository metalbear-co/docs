<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1212 620" width="1212" height="620" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">mirrord for Teams architecture</title>
  <desc id="d">Two developers run local processes with mirrord. Each local process connects to the mirrord Operator in the Kubernetes cluster. The Operator sends incoming traffic to each local process, and each local process sends outgoing traffic, database access, and file reads and writes to the Operator. The Operator connects to a mirrord agent for each target pod. Each agent runs as a separate pod in the network namespace of its target pod. Internet traffic and traffic from other services reach the target pods. The agents send outgoing traffic to other services and database access to the database.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
    <symbol id="k8s" viewBox="0 0 32 32">
      <polygon points="16.00,1.60 27.73,7.25 30.62,19.94 22.51,30.11 9.49,30.11 1.38,19.94 4.27,7.25" fill="#326CE5" stroke="#326CE5" stroke-width="2" stroke-linejoin="round"/>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <circle cx="16" cy="16" r="7"/>
        <line x1="16.00" y1="13.40" x2="16.00" y2="5.80"/><line x1="18.03" y1="14.38" x2="23.97" y2="9.64"/><line x1="18.53" y1="16.58" x2="25.94" y2="18.27"/><line x1="17.13" y1="18.34" x2="20.43" y2="25.19"/><line x1="14.87" y1="18.34" x2="11.57" y2="25.19"/><line x1="13.47" y1="16.58" x2="6.06" y2="18.27"/><line x1="13.97" y1="14.38" x2="8.03" y2="9.64"/>
      </g>
      <circle cx="16" cy="16" r="2.4" fill="#ffffff"/>
    </symbol>
  </defs>
  <rect x="0" y="0" width="1212" height="620" fill="#ffffff"/>

  <!-- Cluster boundary -->
  <rect x="390" y="100" width="800" height="500" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2"/>
  <text x="414" y="128" font-size="15" font-weight="700" fill="#4a44b8">Kubernetes cluster</text>

  <!-- Internet traffic to the target pods -->
  <rect x="585" y="10" width="200" height="52" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="685" y="42" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Internet</text>
  <polyline points="685,62 685,148" fill="none" stroke="#232141" stroke-width="2.5"/>
  <text x="697" y="86" font-size="12.5" fill="#333344">incoming traffic</text>
  <polyline points="535,148 835,148" fill="none" stroke="#232141" stroke-width="2.5"/>
  <line x1="535" y1="148" x2="535" y2="166" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="685" y1="148" x2="685" y2="166" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="835" y1="148" x2="835" y2="166" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Target pods, each with a separate mirrord agent pod in its network namespace -->
  <rect x="470" y="170" width="130" height="60" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="535" y="206" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Pod</text>
  <line x1="535" y1="230" x2="535" y2="250" stroke="#232141" stroke-width="2"/>
  <rect x="470" y="250" width="130" height="50" rx="10" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="535" y="280" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord agent</text>
  <rect x="620" y="170" width="130" height="60" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="685" y="206" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Pod</text>
  <line x1="685" y1="230" x2="685" y2="250" stroke="#232141" stroke-width="2"/>
  <rect x="620" y="250" width="130" height="50" rx="10" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="685" y="280" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord agent</text>
  <rect x="770" y="170" width="130" height="60" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="835" y="206" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Pod</text>
  <line x1="835" y1="230" x2="835" y2="250" stroke="#232141" stroke-width="2"/>
  <rect x="770" y="250" width="130" height="50" rx="10" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="835" y="280" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord agent</text>
  <!-- Operator to agents -->
  <line x1="535" y1="300" x2="535" y2="356" stroke="#232141" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="685" y1="300" x2="685" y2="356" stroke="#232141" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="835" y1="300" x2="835" y2="356" stroke="#232141" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <!-- mirrord Operator -->
  <rect x="450" y="360" width="470" height="200" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="685" y="466" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord Operator</text>

  <!-- Local process 1 -->
  <rect x="20" y="350" width="230" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="135" y="386" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Local process</text>
  <text x="135" y="408" font-size="12.5" fill="#ffffff" text-anchor="middle">developer machine 1</text>
  <line x1="450" y1="372" x2="254" y2="372" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="320" y="364" font-size="12.5" fill="#4a44b8" text-anchor="middle">incoming traffic</text>
  <line x1="250" y1="410" x2="446" y2="410" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="320" y="428" font-size="12.5" fill="#333344" text-anchor="middle">outgoing traffic</text>
  <text x="320" y="444" font-size="12.5" fill="#333344" text-anchor="middle">DB access</text>
  <text x="320" y="460" font-size="12.5" fill="#333344" text-anchor="middle">file reads and writes</text>

  <!-- Local process 2 -->
  <rect x="20" y="480" width="230" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="135" y="516" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Local process</text>
  <text x="135" y="538" font-size="12.5" fill="#ffffff" text-anchor="middle">developer machine 2</text>
  <line x1="450" y1="502" x2="254" y2="502" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="320" y="494" font-size="12.5" fill="#4a44b8" text-anchor="middle">incoming traffic</text>
  <line x1="250" y1="540" x2="446" y2="540" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="320" y="558" font-size="12.5" fill="#333344" text-anchor="middle">outgoing traffic</text>
  <text x="320" y="574" font-size="12.5" fill="#333344" text-anchor="middle">DB access</text>
  <text x="320" y="590" font-size="12.5" fill="#333344" text-anchor="middle">file reads and writes</text>

  <!-- Other services and database -->
  <rect x="1020" y="160" width="150" height="120" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="1095" y="214" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Other</text>
  <text x="1095" y="234" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">services</text>
  <line x1="1020" y1="190" x2="904" y2="190" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="960" y="182" font-size="12.5" fill="#333344" text-anchor="middle">incoming traffic</text>
  <line x1="900" y1="266" x2="1016" y2="266" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="960" y="258" font-size="12.5" fill="#333344" text-anchor="middle">outgoing traffic</text>
  <polyline points="900,290 1095,290 1095,346" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="960" y="308" font-size="12.5" fill="#333344" text-anchor="middle">DB access</text>
  <path d="M1025 364 L1025 440 A70 14 0 0 0 1165 440 L1165 364" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <ellipse cx="1095" cy="364" rx="70" ry="14" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="1095" y="414" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Database</text>
  <!-- Kubernetes logos: what runs in the cluster -->
  <use href="#k8s" x="1172" y="82" width="36" height="36"/>
</svg>
