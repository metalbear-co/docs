<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Preview environment replicas across clusters</title>
  <desc id="d">The developer runs mirrord preview start, stop, or status with the mirrord CLI against the mirrord operator on the Primary cluster, which is management-only. The Primary operator sends one copy of the preview to every workload cluster. On the Default cluster, the operator runs the original preview task. The preview pods steal matched HTTP traffic that enters that cluster and reach the branch DB pod by pod IP, with no tunnel. On the member cluster, the operator runs the replica copy, and replica pods steal matched HTTP traffic that enters that cluster. The customer load balancer sends live traffic into any cluster. A replica reaches the branch DB in four steps. One: the app container connects to the db sidecar at 127.0.0.1 on the branch port. Two: the sidecar connects to the local operator's tunnel gateway over mTLS. Three: the request travels on one HTTP/2 stream of the connection that the Primary dials in through the member cluster's API server. Four: the Primary authorizes the request, then port-forwards to the branch DB pod through the Default cluster's API server. The member namespace holds no cluster credential. On both clusters, the deployed app's patched consumer sends matched messages into one shared temp queue, and the previews compete-consume it, so each message is handled once.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>

  <!-- Developer -->
  <rect x="20" y="58" width="220" height="64" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="130" y="85" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord CLI</text>
  <text x="130" y="106" font-size="12.5" fill="#ffffff" text-anchor="middle">preview start, stop, status</text>

  <!-- Primary cluster -->
  <rect x="300" y="20" width="580" height="122" rx="16" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="320" y="46" font-size="15" font-weight="700" fill="#4a44b8">Primary cluster (management-only)</text>
  <rect x="340" y="58" width="500" height="64" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="590" y="85" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord operator (Primary)</text>
  <text x="590" y="106" font-size="12.5" fill="#ffffff" text-anchor="middle">sends one copy of the preview to every workload cluster</text>

  <!-- Default cluster -->
  <rect x="20" y="180" width="510" height="340" rx="16" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="206" font-size="15" font-weight="700" fill="#4a44b8">Default cluster</text>
  <rect x="310" y="220" width="190" height="70" rx="10" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="405" y="244" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">operator</text>
  <text x="405" y="263" font-size="12.5" fill="#ffffff" text-anchor="middle">runs the original</text>
  <text x="405" y="279" font-size="12.5" fill="#ffffff" text-anchor="middle">preview task</text>
  <path d="M60 330 L60 390 A115 10 0 0 0 290 390 L290 330" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <ellipse cx="175" cy="330" rx="115" ry="10" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="175" y="366" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">Branch DB pod</text>
  <text x="175" y="385" font-size="12.5" fill="#333344" text-anchor="middle">pod IP only, no Service</text>
  <rect x="330" y="320" width="170" height="80" rx="10" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="415" y="347" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">Preview pods</text>
  <text x="415" y="366" font-size="12.5" fill="#333344" text-anchor="middle">steal matched HTTP</text>
  <text x="415" y="383" font-size="12.5" fill="#333344" text-anchor="middle">in this cluster</text>
  <rect x="60" y="440" width="230" height="60" rx="10" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="175" y="465" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">Deployed app</text>
  <text x="175" y="484" font-size="12.5" fill="#333344" text-anchor="middle">patched consumer (splitter)</text>

  <!-- Member cluster -->
  <rect x="670" y="180" width="510" height="340" rx="16" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="690" y="206" font-size="15" font-weight="700" fill="#4a44b8">Member cluster (full replica)</text>
  <rect x="700" y="220" width="230" height="70" rx="10" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="815" y="244" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">operator</text>
  <text x="815" y="263" font-size="12.5" fill="#ffffff" text-anchor="middle">dispatches on labels,</text>
  <text x="815" y="279" font-size="12.5" fill="#ffffff" text-anchor="middle">respawns on drift</text>
  <rect x="960" y="220" width="180" height="70" rx="10" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1050" y="250" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">tunnel gateway</text>
  <text x="1050" y="270" font-size="12.5" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">:4980 mTLS</text>
  <rect x="700" y="318" width="440" height="100" rx="10" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="716" y="339" font-size="14" font-weight="700" fill="#232141">Replica pods (own local steal)</text>
  <rect x="716" y="352" width="184" height="52" rx="8" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="808" y="383" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">App container</text>
  <rect x="960" y="352" width="164" height="52" rx="8" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1042" y="373" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">db sidecar</text>
  <text x="1042" y="391" font-size="12" fill="#ffffff" text-anchor="middle">holds the mTLS leaf</text>
  <rect x="910" y="440" width="230" height="60" rx="10" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="1025" y="465" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">Deployed app</text>
  <text x="1025" y="484" font-size="12.5" fill="#333344" text-anchor="middle">patched consumer (splitter)</text>

  <!-- Customer load balancer -->
  <rect x="545" y="334" width="110" height="52" rx="12" fill="#FFCB7D" stroke="#232141" stroke-width="2"/>
  <text x="600" y="357" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">Customer</text>
  <text x="600" y="375" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">LB</text>
  <text x="600" y="408" font-size="12.5" fill="#333344" text-anchor="middle">traffic enters</text>
  <text x="600" y="425" font-size="12.5" fill="#333344" text-anchor="middle">any cluster</text>

  <!-- Shared temp queue -->
  <rect x="330" y="560" width="540" height="64" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="587" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Shared temp queue</text>
  <text x="600" y="608" font-size="12.5" fill="#333344" text-anchor="middle">created once by the Default cluster's split; each message is handled once</text>

  <!-- CLI to Primary, Primary copies the preview -->
  <line x1="240" y1="90" x2="336" y2="90" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="122" x2="440" y2="216" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="450" y="166" font-size="12.5" fill="#333344">copy</text>
  <polyline points="800,122 800,160 900,160 900,216" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="790" y="164" font-size="12.5" fill="#333344" text-anchor="end">copy</text>

  <!-- Live traffic -->
  <line x1="545" y1="360" x2="504" y2="360" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <line x1="655" y1="360" x2="696" y2="360" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- Default preview pods reach the branch directly -->
  <line x1="330" y1="370" x2="294" y2="370" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="312" y="414" font-size="12.5" fill="#333344" text-anchor="middle">pod IP</text>

  <!-- Replica DB connection, steps 1 to 4 -->
  <line x1="900" y1="378" x2="956" y2="378" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <line x1="1042" y1="352" x2="1042" y2="294" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <polyline points="840,90 1042,90 1042,216" fill="none" stroke="#756DF3" stroke-width="2.5" marker-start="url(#arrow-purple)" marker-end="url(#arrow-purple)"/>
  <text x="900" y="80" font-size="12.5" font-weight="700" fill="#4a44b8">tunnel, dialed by the Primary</text>
  <polyline points="400,122 400,160 230,160 230,316" fill="none" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="218" y="272" font-size="12.5" font-weight="700" fill="#4a44b8" text-anchor="end">port-forward</text>

  <!-- Matched messages and compete-consume -->
  <polyline points="175,500 175,592 326,592" fill="none" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="187" y="582" font-size="12.5" fill="#4a44b8">matched msgs</text>
  <polyline points="1025,500 1025,592 874,592" fill="none" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="1013" y="582" font-size="12.5" fill="#4a44b8" text-anchor="end">matched msgs</text>
  <line x1="415" y1="560" x2="415" y2="404" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="425" y="546" font-size="12.5" fill="#4a44b8">compete-consume</text>
  <line x1="800" y1="560" x2="800" y2="422" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="810" y="546" font-size="12.5" fill="#4a44b8">compete-consume</text>

  <!-- Numbered callouts -->
  <circle cx="928" cy="356" r="11" fill="#756DF3"/>
  <text x="928" y="361" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="1066" cy="306" r="11" fill="#756DF3"/>
  <text x="1066" y="311" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="1066" cy="150" r="11" fill="#756DF3"/>
  <text x="1066" y="155" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="208" cy="234" r="11" fill="#756DF3"/>
  <text x="208" y="239" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

  <!-- Key: one replica DB connection -->
  <text x="40" y="664" font-size="14" font-weight="700" fill="#232141">How a replica reaches the branch DB</text>
  <circle cx="52" cy="688" r="11" fill="#756DF3"/>
  <text x="52" y="693" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="74" y="693" font-size="13" fill="#232141">The app connects to the sidecar at <tspan font-family="Menlo, Consolas, monospace">127.0.0.1:&lt;branch port&gt;</tspan>.</text>
  <circle cx="52" cy="716" r="11" fill="#756DF3"/>
  <text x="52" y="721" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="74" y="721" font-size="13" fill="#232141">The sidecar connects to the local operator's gateway over mTLS. The hello names the branch, and the cert uid is the identity.</text>
  <circle cx="52" cy="744" r="11" fill="#756DF3"/>
  <text x="52" y="749" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="74" y="749" font-size="13" fill="#232141">The request uses one HTTP/2 stream on the connection that the Primary dials in through the member API server.</text>
  <circle cx="52" cy="772" r="11" fill="#756DF3"/>
  <text x="52" y="777" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="74" y="777" font-size="13" fill="#232141">The Primary authorizes it, then port-forwards to the branch DB pod through the Default API server. No cluster credential is in the member namespace.</text>
</svg>
