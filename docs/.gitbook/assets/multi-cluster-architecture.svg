<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 1202 542" width="1202" height="542" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Multi-cluster architecture</title>
  <desc id="d">On your machine, the mirrord CLI and your local application use one connection to the mirrord operator on the Primary cluster. The Primary operator coordinates all clusters and holds the parent session. It can also run workloads, or be management-only. The Primary creates a child session on workload cluster A and on workload cluster B. Each workload cluster has its own operator, an agent, and your pods for the child session. Workload cluster B is also the Default cluster. Traffic intercepted in any cluster flows back through the Primary to your local application. Stateful operations, such as environment variables, files, DNS, outgoing traffic, and DB branching, are served by the Default cluster only.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
    <symbol id="k8s" viewBox="0 0 32 32">
      <polygon points="16.00,1.60 27.73,7.25 30.62,19.94 22.51,30.11 9.49,30.11 1.38,19.94 4.27,7.25" fill="#326CE5" stroke="#326CE5" stroke-width="2" stroke-linejoin="round"/>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <circle cx="16" cy="16" r="7"/>
        <line x1="16.00" y1="13.40" x2="16.00" y2="5.80"/><line x1="18.03" y1="14.38" x2="23.97" y2="9.64"/><line x1="18.53" y1="16.58" x2="25.94" y2="18.27"/><line x1="17.13" y1="18.34" x2="20.43" y2="25.19"/><line x1="14.87" y1="18.34" x2="11.57" y2="25.19"/><line x1="13.47" y1="16.58" x2="6.06" y2="18.27"/><line x1="13.97" y1="14.38" x2="8.03" y2="9.64"/>
      </g>
      <circle cx="16" cy="16" r="2.4" fill="#ffffff"/>
    </symbol>
  </defs>
  <rect x="0" y="-2" width="1202" height="542" fill="#ffffff"/>

  <!-- Your machine -->
  <rect x="20" y="100" width="220" height="220" rx="16" fill="#F5F4FE" stroke="#756DF3" stroke-width="2"/>
  <text x="40" y="128" font-size="15" font-weight="700" fill="#4a44b8">Your machine</text>
  <rect x="40" y="150" width="180" height="68" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="130" y="190" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord CLI</text>
  <rect x="40" y="236" width="180" height="64" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="130" y="274" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Local application</text>

  <!-- Primary cluster -->
  <rect x="380" y="100" width="300" height="270" rx="16" fill="#F5F4FE" stroke="#756DF3" stroke-width="2"/>
  <text x="400" y="128" font-size="15" font-weight="700" fill="#4a44b8">Primary cluster</text>
  <rect x="410" y="150" width="240" height="68" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="530" y="179" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord operator</text>
  <text x="530" y="200" font-size="12.5" fill="#ffffff" text-anchor="middle">coordinates all clusters</text>
  <rect x="410" y="236" width="240" height="64" rx="10" fill="#ffffff" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="530" y="274" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Parent session</text>
  <text x="530" y="328" font-size="12.5" fill="#333344" text-anchor="middle">can also run workloads,</text>
  <text x="530" y="346" font-size="12.5" fill="#333344" text-anchor="middle">or be management-only</text>

  <!-- Workload cluster A -->
  <rect x="800" y="20" width="380" height="200" rx="16" fill="#F5F4FE" stroke="#756DF3" stroke-width="2"/>
  <text x="820" y="48" font-size="15" font-weight="700" fill="#4a44b8">Workload cluster A</text>
  <rect x="825" y="66" width="160" height="52" rx="10" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="905" y="97" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">operator</text>
  <rect x="1000" y="66" width="155" height="52" rx="10" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1077" y="97" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">agent</text>
  <rect x="825" y="136" width="330" height="60" rx="10" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="990" y="162" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">Your pods</text>
  <text x="990" y="181" font-size="12.5" fill="#333344" text-anchor="middle">child session</text>

  <!-- Workload cluster B (Default) -->
  <rect x="800" y="250" width="380" height="210" rx="16" fill="#F5F4FE" stroke="#756DF3" stroke-width="2"/>
  <text x="820" y="278" font-size="15" font-weight="700" fill="#4a44b8">Workload cluster B</text>
  <rect x="1000" y="262" width="155" height="28" rx="8" fill="#FFCB7D" stroke="#232141" stroke-width="2"/>
  <text x="1077" y="281" font-size="12.5" font-weight="700" fill="#232141" text-anchor="middle">Default cluster</text>
  <rect x="825" y="306" width="160" height="52" rx="10" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="905" y="337" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">operator</text>
  <rect x="1000" y="306" width="155" height="52" rx="10" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1077" y="337" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">agent</text>
  <rect x="825" y="376" width="330" height="60" rx="10" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="990" y="402" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">Your pods</text>
  <text x="990" y="421" font-size="12.5" fill="#333344" text-anchor="middle">child session</text>

  <!-- One connection between the CLI and the Primary -->
  <line x1="224" y1="184" x2="406" y2="184" stroke="#756DF3" stroke-width="2.5" marker-start="url(#arrow-purple)" marker-end="url(#arrow-purple)"/>
  <text x="310" y="172" font-size="12.5" font-weight="700" fill="#4a44b8" text-anchor="middle">one connection</text>

  <!-- Child sessions -->
  <polyline points="650,170 720,170 720,92 821,92" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="730" y="124" font-size="12.5" fill="#333344">child</text>
  <text x="730" y="141" font-size="12.5" fill="#333344">session</text>
  <polyline points="650,200 720,200 720,332 821,332" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="730" y="262" font-size="12.5" fill="#333344">child</text>
  <text x="730" y="279" font-size="12.5" fill="#333344">session</text>

  <!-- Caption -->
  <text x="600" y="500" font-size="14" fill="#333344" text-anchor="middle">Traffic intercepted in any cluster flows back through the Primary to your local application.</text>
  <text x="600" y="522" font-size="14" fill="#333344" text-anchor="middle">Stateful operations (env vars, files, DNS, outgoing traffic, DB branching) are served by the Default cluster only.</text>
  <!-- Kubernetes logos: what runs in the cluster -->
  <use href="#k8s" x="662" y="82" width="36" height="36"/>
  <use href="#k8s" x="1162" y="2" width="36" height="36"/>
  <use href="#k8s" x="1162" y="232" width="36" height="36"/>
</svg>
