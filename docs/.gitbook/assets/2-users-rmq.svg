<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1202 640" width="1202" height="640" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Two RabbitMQ splitting sessions</title>
  <desc id="d">A producer sends messages to a RabbitMQ queue in the RabbitMQ cluster. The mirrord operator consumes these messages. It sends messages that match filter x to a temporary queue for the first local application, and messages that match filter y to a temporary queue for the second local application. Both local applications run with mirrord. It sends messages that do not match any filter to a temporary queue for the deployed application. Each application consumes messages from its own temporary queue. A message that matches both filters goes to only one of the two sessions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
    <symbol id="k8s" viewBox="0 0 32 32">
      <polygon points="16.00,1.60 27.73,7.25 30.62,19.94 22.51,30.11 9.49,30.11 1.38,19.94 4.27,7.25" fill="#326CE5" stroke="#326CE5" stroke-width="2" stroke-linejoin="round"/>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <circle cx="16" cy="16" r="7"/>
        <line x1="16.00" y1="13.40" x2="16.00" y2="5.80"/><line x1="18.03" y1="14.38" x2="23.97" y2="9.64"/><line x1="18.53" y1="16.58" x2="25.94" y2="18.27"/><line x1="17.13" y1="18.34" x2="20.43" y2="25.19"/><line x1="14.87" y1="18.34" x2="11.57" y2="25.19"/><line x1="13.47" y1="16.58" x2="6.06" y2="18.27"/><line x1="13.97" y1="14.38" x2="8.03" y2="9.64"/>
      </g>
      <circle cx="16" cy="16" r="2.4" fill="#ffffff"/>
    </symbol>
    <symbol id="rabbitmq" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="15" fill="#ffffff" stroke="#232141" stroke-width="1.5"/>
      <path transform="translate(5.5 5.5) scale(0.875)" fill="#FF6600" d="M23.035 9.601h-7.677a.956.956 0 01-.962-.962V.962a.956.956 0 00-.962-.956H10.56a.956.956 0 00-.962.956V8.64a.956.956 0 01-.962.962H5.762a.956.956 0 01-.961-.962V.962A.956.956 0 003.839 0H.959a.956.956 0 00-.956.962v22.076A.956.956 0 00.965 24h22.07a.956.956 0 00.962-.962V10.58a.956.956 0 00-.962-.98zm-3.86 8.152a1.437 1.437 0 01-1.437 1.443h-1.924a1.437 1.437 0 01-1.436-1.443v-1.917a1.437 1.437 0 011.436-1.443h1.924a1.437 1.437 0 011.437 1.443z"/>
    </symbol>
  </defs>
  <rect x="0" y="0" width="1202" height="640" fill="#ffffff"/>

  <!-- RabbitMQ cluster -->
  <rect x="460" y="116" width="300" height="500" rx="16" fill="#F5F4FE" stroke="#756DF3" stroke-width="2"/>
  <text x="478" y="142" font-size="15" font-weight="700" fill="#4a44b8" text-anchor="start">RabbitMQ cluster</text>

  <!-- Producer -->
  <rect x="520" y="20" width="180" height="56" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="610" y="54" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Producer</text>
  <line x1="650" y1="76" x2="650" y2="158" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="638" y="102" font-size="12.5" fill="#333344" text-anchor="end">send messages</text>

  <!-- Queue -->
  <rect x="485" y="160" width="250" height="80" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <line x1="699" y1="180" x2="699" y2="220" stroke="#232141" stroke-width="1.5"/>
  <line x1="707" y1="180" x2="707" y2="220" stroke="#232141" stroke-width="1.5"/>
  <line x1="715" y1="180" x2="715" y2="220" stroke="#232141" stroke-width="1.5"/>
  <text x="592" y="206" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Queue</text>

  <!-- mirrord operator consumes the original messages -->
  <polyline points="485,200 130,200 130,288" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="190" font-size="12.5" fill="#333344" text-anchor="middle">consume messages</text>
  <rect x="20" y="290" width="220" height="300" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="130" y="437" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord operator</text>
  <text x="130" y="457" font-size="12.5" fill="#ffffff" text-anchor="middle">routes by filter</text>
  <text x="130" y="489" font-size="12.5" fill="#ffffff" text-anchor="middle">a message that matches</text>
  <text x="130" y="505" font-size="12.5" fill="#ffffff" text-anchor="middle">both filters goes to</text>
  <text x="130" y="521" font-size="12.5" fill="#ffffff" text-anchor="middle">only one of the sessions</text>

  <!-- Session x: temporary queue and local application -->
  <line x1="240" y1="330" x2="483" y2="330" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="352" y="304" font-size="12.5" fill="#4a44b8" text-anchor="middle">send messages</text>
  <text x="352" y="320" font-size="12.5" fill="#4a44b8" text-anchor="middle">matching filter x</text>
  <rect x="485" y="290" width="250" height="80" rx="12" fill="#ffffff" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="699" y1="310" x2="699" y2="350" stroke="#756DF3" stroke-width="1.5"/>
  <line x1="707" y1="310" x2="707" y2="350" stroke="#756DF3" stroke-width="1.5"/>
  <line x1="715" y1="310" x2="715" y2="350" stroke="#756DF3" stroke-width="1.5"/>
  <text x="592" y="327" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Temporary queue</text>
  <text x="592" y="347" font-size="12.5" fill="#333344" text-anchor="middle">for local application x</text>
  <line x1="735" y1="330" x2="918" y2="330" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="840" y="320" font-size="12.5" fill="#4a44b8" text-anchor="middle">consume messages</text>
  <rect x="920" y="290" width="260" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1050" y="318" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Application</text>
  <text x="1050" y="338" font-size="12.5" fill="#ffffff" text-anchor="middle">running locally with mirrord</text>
  <text x="1050" y="355" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#ffffff" text-anchor="middle">filter x</text>

  <!-- Session y: temporary queue and local application -->
  <line x1="240" y1="440" x2="483" y2="440" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="352" y="414" font-size="12.5" fill="#4a44b8" text-anchor="middle">send messages</text>
  <text x="352" y="430" font-size="12.5" fill="#4a44b8" text-anchor="middle">matching filter y</text>
  <rect x="485" y="400" width="250" height="80" rx="12" fill="#ffffff" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="699" y1="420" x2="699" y2="460" stroke="#756DF3" stroke-width="1.5"/>
  <line x1="707" y1="420" x2="707" y2="460" stroke="#756DF3" stroke-width="1.5"/>
  <line x1="715" y1="420" x2="715" y2="460" stroke="#756DF3" stroke-width="1.5"/>
  <text x="592" y="437" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Temporary queue</text>
  <text x="592" y="457" font-size="12.5" fill="#333344" text-anchor="middle">for local application y</text>
  <line x1="735" y1="440" x2="918" y2="440" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="840" y="430" font-size="12.5" fill="#4a44b8" text-anchor="middle">consume messages</text>
  <rect x="920" y="400" width="260" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1050" y="428" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Application</text>
  <text x="1050" y="448" font-size="12.5" fill="#ffffff" text-anchor="middle">running locally with mirrord</text>
  <text x="1050" y="465" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#ffffff" text-anchor="middle">filter y</text>

  <!-- Temporary queue and deployed application -->
  <line x1="240" y1="550" x2="483" y2="550" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="352" y="524" font-size="12.5" fill="#333344" text-anchor="middle">send messages</text>
  <text x="352" y="540" font-size="12.5" fill="#333344" text-anchor="middle">not matching any filter</text>
  <rect x="485" y="510" width="250" height="80" rx="12" fill="#ffffff" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="699" y1="530" x2="699" y2="570" stroke="#756DF3" stroke-width="1.5"/>
  <line x1="707" y1="530" x2="707" y2="570" stroke="#756DF3" stroke-width="1.5"/>
  <line x1="715" y1="530" x2="715" y2="570" stroke="#756DF3" stroke-width="1.5"/>
  <text x="592" y="547" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Temporary queue</text>
  <text x="592" y="567" font-size="12.5" fill="#333344" text-anchor="middle">for deployed application</text>
  <line x1="735" y1="550" x2="918" y2="550" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="840" y="540" font-size="12.5" fill="#333344" text-anchor="middle">consume messages</text>
  <rect x="920" y="510" width="260" height="80" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="1050" y="547" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Application</text>
  <text x="1050" y="567" font-size="12.5" fill="#333344" text-anchor="middle">deployed on K8s</text>
  <!-- Kubernetes logos: what runs in the cluster -->
  <use href="#k8s" x="222" y="572" width="36" height="36"/>
  <use href="#k8s" x="1162" y="572" width="36" height="36"/>
  <use href="#rabbitmq" x="742" y="98" width="36" height="36"/>
</svg>
