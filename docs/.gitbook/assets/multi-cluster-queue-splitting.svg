<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 1202 622" width="1202" height="622" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Multi-cluster queue splitting</title>
  <desc id="d">Cluster A in us-east-1 and cluster B in eu-west-1 each have an original queue. In each cluster, the mirrord operator reads the original queue and applies the same filter. Messages that do not match go to a temporary queue for the deployed workload, which the deployed consumers read. Messages that match your filter go from each cluster to one temporary session queue that mirrord creates for your session. Your local application, or a preview environment, reads that session queue directly.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
    <symbol id="k8s" viewBox="0 0 32 32">
      <polygon points="16.00,1.60 27.73,7.25 30.62,19.94 22.51,30.11 9.49,30.11 1.38,19.94 4.27,7.25" fill="#326CE5" stroke="#326CE5" stroke-width="2" stroke-linejoin="round"/>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <circle cx="16" cy="16" r="7"/>
        <line x1="16.00" y1="13.40" x2="16.00" y2="5.80"/><line x1="18.03" y1="14.38" x2="23.97" y2="9.64"/><line x1="18.53" y1="16.58" x2="25.94" y2="18.27"/><line x1="17.13" y1="18.34" x2="20.43" y2="25.19"/><line x1="14.87" y1="18.34" x2="11.57" y2="25.19"/><line x1="13.47" y1="16.58" x2="6.06" y2="18.27"/><line x1="13.97" y1="14.38" x2="8.03" y2="9.64"/>
      </g>
      <circle cx="16" cy="16" r="2.4" fill="#ffffff"/>
    </symbol>
  </defs>
  <rect x="0" y="-2" width="1202" height="622" fill="#ffffff"/>

  <!-- Cluster A -->
  <rect x="20" y="20" width="560" height="340" rx="16" fill="#F5F4FE" stroke="#756DF3" stroke-width="2"/>
  <text x="40" y="48" font-size="15" font-weight="700" fill="#4a44b8">Cluster A (us-east-1)</text>
  <rect x="50" y="68" width="200" height="56" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="135" y="101" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">Original queue</text>
  <line x1="215" y1="80" x2="215" y2="112" stroke="#232141" stroke-width="1.5"/>
  <line x1="225" y1="80" x2="225" y2="112" stroke="#232141" stroke-width="1.5"/>
  <line x1="235" y1="80" x2="235" y2="112" stroke="#232141" stroke-width="1.5"/>
  <rect x="50" y="160" width="200" height="60" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="150" y="186" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord operator</text>
  <text x="150" y="205" font-size="12.5" fill="#ffffff" text-anchor="middle">applies your filter</text>
  <rect x="340" y="160" width="210" height="60" rx="12" fill="#ffffff" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="445" y="186" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">Temp queue</text>
  <text x="445" y="205" font-size="12.5" fill="#333344" text-anchor="middle">for the deployed workload</text>
  <rect x="340" y="268" width="210" height="56" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="445" y="301" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">Deployed consumers</text>

  <!-- Cluster B -->
  <rect x="620" y="20" width="560" height="340" rx="16" fill="#F5F4FE" stroke="#756DF3" stroke-width="2"/>
  <text x="640" y="48" font-size="15" font-weight="700" fill="#4a44b8">Cluster B (eu-west-1)</text>
  <rect x="650" y="68" width="200" height="56" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="735" y="101" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">Original queue</text>
  <line x1="815" y1="80" x2="815" y2="112" stroke="#232141" stroke-width="1.5"/>
  <line x1="825" y1="80" x2="825" y2="112" stroke="#232141" stroke-width="1.5"/>
  <line x1="835" y1="80" x2="835" y2="112" stroke="#232141" stroke-width="1.5"/>
  <rect x="650" y="160" width="200" height="60" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="750" y="186" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord operator</text>
  <text x="750" y="205" font-size="12.5" fill="#ffffff" text-anchor="middle">applies the same filter</text>
  <rect x="940" y="160" width="210" height="60" rx="12" fill="#ffffff" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1045" y="186" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">Temp queue</text>
  <text x="1045" y="205" font-size="12.5" fill="#333344" text-anchor="middle">for the deployed workload</text>
  <rect x="940" y="268" width="210" height="56" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="1045" y="301" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">Deployed consumers</text>

  <!-- Temporary session queue -->
  <rect x="440" y="420" width="320" height="64" rx="12" fill="#ffffff" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="447" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Temporary session queue</text>
  <text x="600" y="468" font-size="12.5" fill="#333344" text-anchor="middle">created by mirrord for your session</text>

  <!-- Local application -->
  <rect x="470" y="536" width="260" height="64" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="600" y="563" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Your local application</text>
  <text x="600" y="584" font-size="12.5" fill="#ffffff" text-anchor="middle">or preview environment</text>

  <!-- Cluster A arrows -->
  <line x1="150" y1="124" x2="150" y2="156" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="250" y1="190" x2="336" y2="190" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="293" y="180" font-size="12.5" fill="#333344" text-anchor="middle">no match</text>
  <line x1="445" y1="220" x2="445" y2="264" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polyline points="150,220 150,390 520,390 520,416" fill="none" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="162" y="290" font-size="12.5" font-weight="700" fill="#4a44b8">matches your filter</text>

  <!-- Cluster B arrows -->
  <line x1="750" y1="124" x2="750" y2="156" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="850" y1="190" x2="936" y2="190" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="893" y="180" font-size="12.5" fill="#333344" text-anchor="middle">no match</text>
  <line x1="1045" y1="220" x2="1045" y2="264" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polyline points="750,220 750,390 680,390 680,416" fill="none" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="762" y="290" font-size="12.5" font-weight="700" fill="#4a44b8">matches your filter</text>

  <!-- Local app reads the session queue -->
  <line x1="600" y1="484" x2="600" y2="532" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="612" y="514" font-size="12.5" font-weight="700" fill="#4a44b8">reads directly</text>
  <!-- Kubernetes logos: what runs in the cluster -->
  <use href="#k8s" x="562" y="2" width="36" height="36"/>
  <use href="#k8s" x="1162" y="2" width="36" height="36"/>
</svg>
