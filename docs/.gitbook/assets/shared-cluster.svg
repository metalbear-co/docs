<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 1200 722" width="1200" height="722" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How several developers use one cluster at the same time</title>
  <desc id="d">Four developers run local processes against one shared cluster. One: an upstream service sends requests to a shared service, and HTTP filters on the x-header header send yellow requests to developer A and green requests to developer B. Two: SQS or Kafka splitting sends the queue messages for developer B and developer C to them, and other messages stay with the deployed service. Three: developer D targets the upstream service, and a mirrord policy blocks writes to the main database. Four: DB branching gives developer D a personal database branch, which receives the writes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ACACAC"/>
    </marker>
    <symbol id="k8s" viewBox="0 0 32 32">
      <polygon points="16.00,1.60 27.73,7.25 30.62,19.94 22.51,30.11 9.49,30.11 1.38,19.94 4.27,7.25" fill="#326CE5" stroke="#326CE5" stroke-width="2" stroke-linejoin="round"/>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <circle cx="16" cy="16" r="7"/>
        <line x1="16.00" y1="13.40" x2="16.00" y2="5.80"/><line x1="18.03" y1="14.38" x2="23.97" y2="9.64"/><line x1="18.53" y1="16.58" x2="25.94" y2="18.27"/><line x1="17.13" y1="18.34" x2="20.43" y2="25.19"/><line x1="14.87" y1="18.34" x2="11.57" y2="25.19"/><line x1="13.47" y1="16.58" x2="6.06" y2="18.27"/><line x1="13.97" y1="14.38" x2="8.03" y2="9.64"/>
      </g>
      <circle cx="16" cy="16" r="2.4" fill="#ffffff"/>
    </symbol>
  </defs>
  <rect x="0" y="-2" width="1200" height="722" fill="#ffffff"/>

  <!-- Cluster boundary -->
  <rect x="240" y="20" width="590" height="580" rx="16" fill="#F5F4FE" stroke="#756DF3" stroke-width="2"/>
  <text x="260" y="48" font-size="15" font-weight="700" fill="#4a44b8">Shared Kubernetes cluster</text>

  <!-- Developer D -->
  <rect x="20" y="250" width="180" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="110" y="284" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Developer D</text>
  <text x="110" y="306" font-size="12.5" fill="#ffffff" text-anchor="middle">local process</text>

  <!-- Upstream service -->
  <rect x="280" y="250" width="170" height="80" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="365" y="284" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Upstream service</text>
  <text x="365" y="306" font-size="12.5" fill="#333344" text-anchor="middle">target of D</text>

  <!-- Queue -->
  <rect x="600" y="64" width="200" height="64" rx="12" fill="#FFCB7D" stroke="#232141" stroke-width="2"/>
  <text x="682" y="92" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Queue</text>
  <text x="682" y="113" font-size="12.5" fill="#232141" text-anchor="middle">SQS or Kafka</text>
  <line x1="760" y1="76" x2="760" y2="116" stroke="#232141" stroke-width="1.5"/>
  <line x1="770" y1="76" x2="770" y2="116" stroke="#232141" stroke-width="1.5"/>
  <line x1="780" y1="76" x2="780" y2="116" stroke="#232141" stroke-width="1.5"/>

  <!-- Shared service -->
  <rect x="600" y="160" width="200" height="260" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="700" y="270" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Shared service</text>
  <text x="700" y="292" font-size="12.5" fill="#333344" text-anchor="middle">target of A, B, and C</text>
  <text x="700" y="320" font-size="12.5" fill="#333344" text-anchor="middle">unmatched requests and</text>
  <text x="700" y="337" font-size="12.5" fill="#333344" text-anchor="middle">other messages stay here</text>

  <!-- Main DB -->
  <path d="M280 470 L280 530 A60 12 0 0 0 400 530 L400 470" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <ellipse cx="340" cy="470" rx="60" ry="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="340" y="510" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">Main DB</text>
  <text x="340" y="528" font-size="12" fill="#333344" text-anchor="middle">sensitive</text>

  <!-- DB branch -->
  <path d="M460 470 L460 530 A60 12 0 0 0 580 530 L580 470" fill="#ffffff" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <ellipse cx="520" cy="470" rx="60" ry="12" fill="#ffffff" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="520" y="510" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">DB branch</text>
  <text x="520" y="528" font-size="12" fill="#333344" text-anchor="middle">personal to D</text>

  <!-- Developers A, B, C -->
  <rect x="1000" y="150" width="180" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1090" y="184" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Developer A</text>
  <text x="1090" y="206" font-size="12.5" fill="#ffffff" text-anchor="middle">local process</text>
  <rect x="1000" y="250" width="180" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1090" y="284" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Developer B</text>
  <text x="1090" y="306" font-size="12.5" fill="#ffffff" text-anchor="middle">local process</text>
  <rect x="1000" y="350" width="180" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1090" y="384" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Developer C</text>
  <text x="1090" y="406" font-size="12.5" fill="#ffffff" text-anchor="middle">local process</text>

  <!-- D targets the upstream service -->
  <line x1="200" y1="290" x2="276" y2="290" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- Upstream service calls the shared service -->
  <line x1="450" y1="290" x2="596" y2="290" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="523" y="262" font-size="12.5" fill="#333344" text-anchor="middle">requests with</text>
  <text x="523" y="280" font-size="12.5" fill="#333344" text-anchor="middle" font-family="Menlo, Consolas, monospace">x-header</text>

  <!-- Queue feeds the shared service -->
  <line x1="700" y1="128" x2="700" y2="156" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Shared service to developers -->
  <line x1="800" y1="190" x2="996" y2="190" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="846" y="180" font-size="12.5" fill="#4a44b8" font-family="Menlo, Consolas, monospace">x-header: yellow</text>
  <line x1="800" y1="290" x2="996" y2="290" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="846" y="262" font-size="12.5" fill="#4a44b8" font-family="Menlo, Consolas, monospace">x-header: green</text>
  <text x="846" y="280" font-size="12.5" fill="#4a44b8">+ B's messages</text>
  <line x1="800" y1="390" x2="996" y2="390" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="846" y="380" font-size="12.5" fill="#4a44b8">C's messages</text>

  <!-- D's writes: blocked to main DB, sent to the branch -->
  <line x1="340" y1="330" x2="340" y2="452" stroke="#ACACAC" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-grey)"/>
  <text x="350" y="400" font-size="12.5" fill="#8a8a99">write blocked</text>
  <polyline points="420,330 420,370 520,370 520,452" fill="none" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="530" y="420" font-size="12.5" fill="#4a44b8">D's writes</text>

  <!-- Numbered callouts -->
  <circle cx="523" cy="236" r="12" fill="#756DF3"/>
  <text x="523" y="241" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="578" cy="96" r="12" fill="#756DF3"/>
  <text x="578" y="101" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="310" cy="396" r="12" fill="#756DF3"/>
  <text x="310" y="401" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="610" cy="500" r="12" fill="#756DF3"/>
  <text x="610" y="505" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

  <!-- Key -->
  <circle cx="52" cy="642" r="12" fill="#756DF3"/>
  <text x="52" y="647" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="74" y="647" font-size="14" fill="#232141">HTTP filters send each request to one developer.</text>
  <circle cx="52" cy="682" r="12" fill="#756DF3"/>
  <text x="52" y="687" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="74" y="687" font-size="14" fill="#232141">SQS or Kafka splitting gives each developer their own messages.</text>
  <circle cx="622" cy="642" r="12" fill="#756DF3"/>
  <text x="622" y="647" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="644" y="647" font-size="14" fill="#232141">mirrord policies block forbidden actions, like writes to the main DB.</text>
  <circle cx="622" cy="682" r="12" fill="#756DF3"/>
  <text x="622" y="687" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="644" y="687" font-size="14" fill="#232141">DB branching gives a developer a personal, isolated database.</text>
  <!-- Kubernetes logos: what runs in the cluster -->
  <use href="#k8s" x="812" y="2" width="36" height="36"/>
</svg>
