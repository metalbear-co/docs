<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1202 642" width="1202" height="642" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Preview environments with mounted-config queue splitting</title>
  <desc id="d">Two inputs go to the mirrord operator: your ConfigMap worker-config in the cluster, with kafka.consumer.topic: orders, and the config_mounts file content from feature.preview.config_mounts in your mirrord.json, with topic: orders and logLevel: debug. The operator copies each input and swaps only the queue-name fields. It makes four outputs. The fallback copy qs-cm-... has topic mirrord-tmp-fallback-orders for unfiltered messages, and the deployed workload pods roll onto it at /config. The session A copy pcm-a-split-vol0 of worker-config has topic mirrord-tmp-A-orders and preview pod A mounts it at /config. The rewritten config_mounts pcm-a-config-mounts has topic mirrord-tmp-A-orders and logLevel: debug, and preview pod A mounts it at /config-pr, so preview pod A reads both files. The session B copy pcm-b-split-vol0 has topic mirrord-tmp-B-orders and preview pod B mounts it at /config.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
    <symbol id="k8s" viewBox="0 0 32 32">
      <polygon points="16.00,1.60 27.73,7.25 30.62,19.94 22.51,30.11 9.49,30.11 1.38,19.94 4.27,7.25" fill="#326CE5" stroke="#326CE5" stroke-width="2" stroke-linejoin="round"/>
      <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <circle cx="16" cy="16" r="7"/>
        <line x1="16.00" y1="13.40" x2="16.00" y2="5.80"/><line x1="18.03" y1="14.38" x2="23.97" y2="9.64"/><line x1="18.53" y1="16.58" x2="25.94" y2="18.27"/><line x1="17.13" y1="18.34" x2="20.43" y2="25.19"/><line x1="14.87" y1="18.34" x2="11.57" y2="25.19"/><line x1="13.47" y1="16.58" x2="6.06" y2="18.27"/><line x1="13.97" y1="14.38" x2="8.03" y2="9.64"/>
      </g>
      <circle cx="16" cy="16" r="2.4" fill="#ffffff"/>
    </symbol>
  </defs>
  <rect x="0" y="0" width="1202" height="642" fill="#ffffff"/>

  <!-- Inputs -->
  <rect x="120" y="20" width="400" height="150" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="320" y="50" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Your ConfigMap</text>
  <text x="320" y="72" font-size="12.5" fill="#333344" text-anchor="middle">in the cluster</text>
  <rect x="150" y="90" width="340" height="60" rx="8" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="320" y="115" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">worker-config</text>
  <text x="320" y="135" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">kafka.consumer.topic: orders</text>

  <rect x="680" y="20" width="400" height="150" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="880" y="50" font-size="16" font-weight="700" fill="#232141" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">config_mounts</tspan> file content</text>
  <text x="880" y="72" font-size="12.5" fill="#333344" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">feature.preview.config_mounts</tspan> in your mirrord.json</text>
  <rect x="710" y="90" width="340" height="60" rx="8" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="880" y="115" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">topic: orders</text>
  <text x="880" y="135" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">logLevel: debug</text>

  <line x1="320" y1="170" x2="320" y2="216" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="880" y1="170" x2="880" y2="216" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- mirrord operator -->
  <rect x="40" y="220" width="1120" height="70" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="600" y="249" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mirrord operator</text>
  <text x="600" y="272" font-size="12.5" fill="#ffffff" text-anchor="middle">copies each input and swaps only the queue-name fields</text>

  <line x1="160" y1="290" x2="160" y2="336" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="453" y1="290" x2="453" y2="336" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <line x1="747" y1="290" x2="747" y2="336" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <line x1="1040" y1="290" x2="1040" y2="336" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- Copies that the operator makes -->
  <rect x="20" y="340" width="280" height="130" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="160" y="368" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Fallback copy</text>
  <text x="160" y="389" font-size="12.5" fill="#333344" text-anchor="middle">ConfigMap, unfiltered messages</text>
  <text x="160" y="420" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">qs-cm-...</text>
  <text x="160" y="440" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">topic: mirrord-tmp-fallback-orders</text>

  <rect x="313" y="340" width="280" height="130" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="453" y="368" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Session A copy</text>
  <text x="453" y="389" font-size="12.5" fill="#333344" text-anchor="middle">ConfigMap, copy of <tspan font-family="Menlo, Consolas, monospace">worker-config</tspan></text>
  <text x="453" y="420" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">pcm-a-split-vol0</text>
  <text x="453" y="440" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">topic: mirrord-tmp-A-orders</text>

  <rect x="607" y="340" width="280" height="130" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="747" y="368" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Rewritten <tspan font-family="Menlo, Consolas, monospace">config_mounts</tspan></text>
  <text x="747" y="389" font-size="12.5" fill="#333344" text-anchor="middle">your mirrord.json content, topic swapped</text>
  <text x="747" y="416" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">pcm-a-config-mounts</text>
  <text x="747" y="435" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">topic: mirrord-tmp-A-orders</text>
  <text x="747" y="454" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">logLevel: debug</text>

  <rect x="900" y="340" width="280" height="130" rx="12" fill="#F5F4FE" stroke="#756DF3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1040" y="368" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Session B copy</text>
  <text x="1040" y="389" font-size="12.5" fill="#333344" text-anchor="middle">ConfigMap, copy of <tspan font-family="Menlo, Consolas, monospace">worker-config</tspan></text>
  <text x="1040" y="420" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">pcm-b-split-vol0</text>
  <text x="1040" y="440" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#232141" text-anchor="middle">topic: mirrord-tmp-B-orders</text>

  <!-- Mounts -->
  <line x1="160" y1="470" x2="160" y2="536" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="172" y="508" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344">/config</text>
  <line x1="453" y1="470" x2="453" y2="536" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="465" y="508" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#4a44b8">/config</text>
  <line x1="747" y1="470" x2="747" y2="536" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="759" y="508" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#4a44b8">/config-pr</text>
  <line x1="1040" y1="470" x2="1040" y2="536" stroke="#756DF3" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="1052" y="508" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#4a44b8">/config</text>

  <!-- Readers -->
  <rect x="20" y="540" width="280" height="80" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="160" y="574" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Deployed workload</text>
  <text x="160" y="596" font-size="12.5" fill="#333344" text-anchor="middle">pods rolled onto the copy</text>
  <rect x="373" y="540" width="454" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="600" y="574" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Preview pod A</text>
  <text x="600" y="596" font-size="12.5" fill="#ffffff" text-anchor="middle">reads both its files</text>
  <rect x="900" y="540" width="280" height="80" rx="12" fill="#756DF3" stroke="#232141" stroke-width="2"/>
  <text x="1040" y="585" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Preview pod B</text>
  <!-- Kubernetes logos: what runs in the cluster -->
  <use href="#k8s" x="502" y="152" width="36" height="36"/>
  <use href="#k8s" x="1142" y="272" width="36" height="36"/>
  <use href="#k8s" x="282" y="602" width="36" height="36"/>
  <use href="#k8s" x="809" y="602" width="36" height="36"/>
  <use href="#k8s" x="1162" y="602" width="36" height="36"/>
</svg>
